<style>
  :root {
    --bg: #f4f6f8; --card: #fff; --ink: #1f2937; --muted: #6b7280; --line: #e5e7eb;
    --pri: #0f766e; --pri-ink: #fff; --pri-weak: #e6f4f2;
    --ok: #15803d; --ok-bg: #dcfce7; --warn: #b45309; --warn-bg: #fef3c7;
    --bad: #b91c1c; --bad-bg: #fee2e2; --info: #1d4ed8; --info-bg: #dbeafe;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Heebo, Arial, sans-serif; font-size: 16px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .top { background: var(--pri); color: var(--pri-ink); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .brand { font-weight: 700; font-size: 18px; }
  .userbox { font-size: 14px; display: flex; gap: 10px; align-items: center; }
  .userbox button { background: transparent; border: 1px solid rgba(255,255,255,.6); color: #fff; border-radius: 8px; padding: 3px 10px; cursor: pointer; font-size: 13px; }
  nav.tabs { display: flex; gap: 4px; background: #fff; border-bottom: 1px solid var(--line); padding: 0 8px; overflow-x: auto; position: sticky; top: 0; z-index: 5; }
  nav.tabs button { border: 0; background: none; padding: 12px 14px; cursor: pointer; white-space: nowrap; color: var(--muted); border-bottom: 3px solid transparent; font-weight: 500; }
  nav.tabs button.on { color: var(--pri); border-bottom-color: var(--pri); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 20px; margin: 4px 0 12px; }
  h3 { font-size: 17px; margin: 20px 0 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 500; }
  .btn:hover { border-color: #cbd5e1; }
  .btn.pri { background: var(--pri); color: #fff; border-color: var(--pri); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--pri); }
  .btn.danger { color: var(--bad); }
  .btn.sm { padding: 5px 10px; font-size: 14px; }
  .btn:disabled { opacity: .5; cursor: default; }
  label.f { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=email], input[type=number], input[type=date], input[type=time], select, textarea {
    width: 100%; border: 1px solid #d1d5db; border-radius: 10px; padding: 9px 10px; background: #fff; }
  textarea { min-height: 60px; resize: vertical; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .b-ok { background: var(--ok-bg); color: var(--ok); }
  .b-warn { background: var(--warn-bg); color: var(--warn); }
  .b-bad { background: var(--bad-bg); color: var(--bad); }
  .b-info { background: var(--info-bg); color: var(--info); }
  .b-missing { background: var(--bad-bg); color: var(--bad); }
  .b-pending { background: #f3f4f6; color: #374151; }
  .b-future { background: #f3f4f6; color: var(--muted); }
  .tag { display: inline-block; font-size: 12px; background: #f3f4f6; color: #374151; border-radius: 6px; padding: 1px 7px; margin-inline-start: 6px; font-weight: 400; }

  /* שיעור */
  .lesson { border-inline-start: 5px solid var(--line); }
  .lesson.s-ok { border-inline-start-color: var(--ok); }
  .lesson.s-warn { border-inline-start-color: #f59e0b; }
  .lesson.s-bad, .lesson.s-missing { border-inline-start-color: var(--bad); }
  .lesson.s-info { border-inline-start-color: var(--info); }
  .lesson-head { display: flex; gap: 12px; align-items: flex-start; }
  .lesson-time { font-weight: 700; font-size: 17px; min-width: 52px; }
  .lesson-subj { font-weight: 700; }
  .lesson-studs { color: #374151; font-size: 15px; margin-top: 2px; }
  .lesson-sum { font-size: 14px; color: var(--muted); margin-top: 8px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .choice { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 14px 8px; cursor: pointer; font-weight: 500; font-size: 15px; }
  .choice.on.c-ok { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
  .choice.on.c-warn { border-color: #f59e0b; background: var(--warn-bg); color: var(--warn); }
  .choice.on.c-bad { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
  .choice.on.c-info { border-color: var(--info); background: var(--info-bg); color: var(--info); }
  .stud-row { border-top: 1px solid var(--line); padding: 10px 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 7px 14px; cursor: pointer; }
  .seg button.on.p { background: var(--ok-bg); color: var(--ok); font-weight: 700; }
  .seg button.on.a { background: var(--bad-bg); color: var(--bad); font-weight: 700; }
  .form-actions { display: flex; gap: 8px; margin-top: 14px; }
  .form-actions .btn.pri { flex: 1; padding: 12px; font-size: 17px; }
  .alert { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; }
  .alert.bad { background: var(--bad-bg); color: #7f1d1d; }
  .alert.warn { background: var(--warn-bg); color: #78350f; }
  .datebar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .datebar .label { flex: 1; text-align: center; font-weight: 700; font-size: 18px; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }

  /* לוח בקרה */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
  .chip.on { background: var(--pri); color: #fff; border-color: var(--pri); }
  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 14px 0; }
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
  .kpi .v { font-size: 26px; font-weight: 700; }
  .kpi .l { font-size: 13px; color: var(--muted); }
  .kpi.bad .v { color: var(--bad); } .kpi.ok .v { color: var(--ok); } .kpi.info .v { color: var(--info); } .kpi.warn .v { color: var(--warn); }
  .tbl-wrap { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 8px 10px; text-align: start; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { background: #f9fafb; font-weight: 500; color: #374151; position: sticky; top: 0; }
  td.num, th.num { text-align: center; }
  tr.click { cursor: pointer; } tr.click:hover td { background: #f9fafb; }
  tr.low td, tr.low td.first { background: #fff1f2; }
  .low-link { color: inherit; font-weight: 500; }
  .who { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .hist.changed { border-inline-start: 4px solid #f59e0b; }
  .hist-line { font-size: 14px; margin-top: 6px; }
  .hist-line span { font-weight: 500; }
  .hist-line.before { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(0,0,0,.25); }
  .hist-line.before span { text-decoration: none; display: inline-block; }
  td.first, th.first { position: sticky; right: 0; background: inherit; }
  tbody td.first { background: #fff; font-weight: 500; }
  .pct { display: flex; align-items: center; gap: 6px; min-width: 110px; }
  .pct .bar { flex: 1; height: 8px; background: #eef0f3; border-radius: 4px; overflow: hidden; }
  .pct .bar i { display: block; height: 100%; }
  .bars .b { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 14px; }
  .bars .b .t { width: 45%; }
  .bars .b .track { flex: 1; background: #eef0f3; border-radius: 4px; height: 10px; overflow: hidden; }
  .bars .b .track i { display: block; height: 100%; background: var(--pri); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  details summary { cursor: pointer; font-weight: 500; padding: 6px 0; }

  /* מערכת שעות */
  .daycol h4 { margin: 16px 0 8px; font-size: 16px; color: var(--pri); }
  .slot { display: flex; gap: 12px; align-items: center; }
  .tt-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tt-bar select { width: auto; min-width: 180px; flex: 1; max-width: 340px; }
  .tt-sum { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 12px 0 10px; }
  .tt-sum .name { font-size: 19px; font-weight: 700; }
  .tt-wrap { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); }
  table.tt { table-layout: fixed; min-width: 660px; }
  table.tt th, table.tt td { white-space: normal; border: 1px solid var(--line); padding: 4px; vertical-align: top; }
  table.tt thead th { text-align: center; font-size: 15px; position: static; }
  table.tt th.p { width: 78px; text-align: center; background: #f9fafb; font-size: 13px; font-weight: 500; vertical-align: middle; }
  table.tt th.p small { display: block; color: var(--muted); font-weight: 400; font-size: 11.5px; }
  table.tt td { height: 62px; }
  table.tt td.conf { background: #fff1f2; }
  .tt-add { width: 100%; height: 100%; min-height: 52px; border: 1px dashed transparent; background: none; color: #cbd5e1; cursor: pointer; border-radius: 8px; font-size: 20px; }
  .tt-add:hover { border-color: var(--pri); color: var(--pri); background: var(--pri-weak); }
  .tt-slot { display: block; width: 100%; text-align: start; border: 0; border-inline-start: 4px solid; border-radius: 8px; padding: 5px 7px; font-size: 12.5px; line-height: 1.3; margin-bottom: 3px; color: #1f2937; }
  button.tt-slot { cursor: pointer; }
  button.tt-slot:hover { filter: brightness(.96); }
  .tt-slot b { display: block; font-size: 14px; }
  .tt-slot .w { color: #374151; }
  .tt-slot.future { opacity: .75; border-inline-start-style: dashed; }
  .tt-slot .warn-t { color: var(--bad); font-weight: 500; }
  .tt-legend { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .tt-day .tt-row { display: flex; gap: 10px; align-items: stretch; border-bottom: 1px solid var(--line); padding: 6px 0; }
  .tt-day .tt-row:last-child { border-bottom: 0; }
  .tt-day .when { min-width: 72px; font-size: 14px; font-weight: 500; padding-top: 6px; }
  .tt-day .when small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
  .tt-day .tt-add { min-height: 40px; font-size: 15px; color: #94a3b8; border-color: #e5e7eb; text-align: start; padding: 0 12px; }
  .per-row { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
  .per-row b { min-width: 58px; font-weight: 500; }
  .per-row input[type=time] { width: auto; }
  .warnbox { background: var(--warn-bg); color: #78350f; border-radius: 10px; padding: 8px 10px; font-size: 14px; margin-top: 8px; }
  .modal-sub { color: var(--muted); margin: -4px 0 6px; }
  .linkbtn { background: none; border: 0; color: var(--pri); cursor: pointer; padding: 6px 0; font-weight: 500; }

  /* ניהול */
  .subtabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .list-item { display: flex; gap: 10px; align-items: center; }
  .dim { opacity: .55; }
  .sched-list { margin-top: 10px; border-top: 1px solid var(--line); }
  .sched-row { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .sched-row:last-child { border-bottom: 0; }
  .sched-when { min-width: 105px; color: #374151; }
  .checks { max-height: 220px; overflow-y: auto; border: 1px solid #d1d5db; border-radius: 10px; padding: 6px 10px; }
  .checks label { display: flex; gap: 8px; align-items: center; padding: 5px 0; }

  /* חלון קופץ */
  .modal { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: flex-start; justify-content: center; padding: 30px 12px; z-index: 50; overflow-y: auto; }
  .modal.hidden, .hidden { display: none !important; }
  .modal-box { background: #fff; border-radius: 16px; width: 100%; max-width: 520px; padding: 18px; }
  .modal-box h3 { margin-top: 0; }

  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 18px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--bad); }
  #busy { position: fixed; top: 0; right: 0; left: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--pri), transparent); background-size: 200% 100%; animation: slide 1s linear infinite; display: none; z-index: 70; }
  #busy.on { display: block; }
  @keyframes slide { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .login { max-width: 380px; margin: 40px auto; }
  #install-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; background: #fff; border-top: 3px solid var(--pri);
    box-shadow: 0 -4px 16px rgba(0,0,0,.12); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: center; }
  #install-bar .small { color: var(--muted); margin-top: 2px; }
  .ios-share { display: inline-block; border: 1px solid #94a3b8; border-radius: 4px; padding: 0 4px; font-size: 12px; }
  @media (display-mode: standalone) { .top { padding-top: calc(12px + env(safe-area-inset-top)); } }

  .report-head h2 { margin-bottom: 2px; }
  .report-kpis { grid-template-columns: repeat(auto-fit, minmax(95px, 1fr)); }

  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    .top, nav.tabs, .no-print, #dev-panel, #dev-notice, #toast, #busy, .modal { display: none !important; }
    html, body { background: #fff; font-size: 12px; }
    main { max-width: none; padding: 0; }
    .card, .kpi { border-color: #bbb; break-inside: avoid; }
    .report-kpis { grid-template-columns: repeat(7, 1fr); margin: 8px 0; }
    .kpi { padding: 4px 8px; } .kpi .v { font-size: 16px; }
    .tbl-wrap { overflow: visible; border: 0; border-radius: 0; }
    table { font-size: 10.5px; }
    th, td { white-space: normal !important; padding: 3px 5px; border: 1px solid #bbb; }
    th { position: static; background: #eee !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    thead { display: table-header-group; }
    tr { break-inside: avoid; }
    h3 { break-after: avoid; margin: 12px 0 6px; }
  }

  @media (max-width: 640px) {
    main { padding: 12px; }
    .two { grid-template-columns: 1fr; }
    .kpi .v { font-size: 22px; }
    .brand { font-size: 16px; }
  }
</style>

<body>
<div id="busy"></div>
<header class="top">
  <div class="brand">מעקב שעות סל אישי</div>
  <div class="userbox" id="userbox"></div>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="app"><div class="empty">טוען…</div></main>
<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
<div id="toast"></div>

<script>
/* ============================== קבועים ומצב ============================== */
const HELD = 'התקיים', NOT_HELD = 'לא התקיים', POSTPONED = 'נדחה';
const DAY_LETTERS = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
const ROLE_COORD = 'רכזת', ROLE_TEACHER = 'מורה', ROLE_MANAGER = 'הנהלה';

const S = {
  boot: null, tab: null, today: null,
  day: { date: null, teacher: '', data: null }, forms: {},
  dash: { preset: 'week', from: '', to: '', data: null, f: { student: '', teacher: '', subject: '', className: '' } },
  rep: { preset: 'month', from: '', to: '', data: null, f: { student: '', teacher: '', subject: '', className: '' }, view: 'students', student: '' },
  sched: { date: '', data: null, view: 'student', student: '', teacher: '', day: '' },
  admin: { sub: 'students', data: null, more: false, periodsDraft: null },
  login: { step: 'email', email: '' },
};

/* ============================== תקשורת עם השרת ============================== */
let busyCount = 0;
function setBusy(d) { busyCount += d; document.getElementById('busy').classList.toggle('on', busyCount > 0); }

function getToken() { try { return localStorage.getItem('sal_token') || ''; } catch (e) { return S._token || ''; } }
function setToken(t) { S._token = t; try { t ? localStorage.setItem('sal_token', t) : localStorage.removeItem('sal_token'); } catch (e) {} }

/**
 * שליחת פעולה לשרת. בתוך Google (Apps Script) – דרך google.script.run.
 * באפליקציה המותקנת (PWA) מוגדר window.API_URL – ואז דרך fetch לכתובת הסקריפט.
 */
function transport(action, payload) {
  const args = [getToken(), action, JSON.stringify(payload || {})];
  if (window.API_URL) {
    return fetch(window.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: args[0], action: args[1], payload: args[2] }),
    }).then(r => { if (!r.ok) throw new Error('השרת לא זמין כרגע (' + r.status + ')'); return r.text(); });
  }
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).api(...args);
  });
}

function call(action, payload) {
  setBusy(1);
  return transport(action, payload)
    .catch(e => {
      if (navigator.onLine === false) throw new Error('אין חיבור לאינטרנט. נסי שוב כשתהיה קליטה.');
      if (e instanceof TypeError) throw new Error('לא הצלחנו להתחבר לשרת. נסי שוב בעוד רגע.');
      throw new Error(e && e.message ? e.message : 'בעיית תקשורת. נסי שוב.');
    })
    .then(txt => {
      const r = JSON.parse(txt);
      if (r.ok) return r.data;
      const err = new Error(r.error || 'שגיאה');
      err.auth = !!r.auth;
      if (r.auth) showLogin();
      throw err;
    })
    .finally(() => setBusy(-1));
}

/* ============================== עזרים ============================== */
function h(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function parseD(d) { const [y, m, dd] = d.split('-').map(Number); return new Date(Date.UTC(y, m - 1, dd)); }
function addDays(d, n) { const x = parseD(d); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
function weekday(d) { return parseD(d).getUTCDay(); }
function fmtDate(d, withDay = true) { if (!d) return ''; const [, m, dd] = d.split('-'); return (withDay ? 'יום ' + DAY_LETTERS[weekday(d)] + ' ' : '') + (+dd) + '.' + (+m); }
function fmtStamp(s) { const [d, t] = String(s).split(' '); return d && d.length === 10 ? fmtFull(d) + (t ? ' ' + t : '') : s; }
function fmtFull(d) { if (!d) return ''; const [y, m, dd] = d.split('-'); return (+dd) + '.' + (+m) + '.' + y; }
function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(t._h); t._h = setTimeout(() => { t.className = ''; }, isErr ? 4500 : 2200);
}
function fail(e) { if (!e.auth) toast(e.message || 'שגיאה', true); }
function isCoord() { return S.boot && S.boot.user.role === ROLE_COORD; }
function canView() { return S.boot && (S.boot.user.role === ROLE_COORD || S.boot.user.role === ROLE_MANAGER); }
function opt(v, label, sel) { return `<option value="${h(v)}"${String(v) === String(sel) ? ' selected' : ''}>${h(label)}</option>`; }
function uniq(arr) { return [...new Set(arr.filter(Boolean))].sort((a, b) => a.localeCompare(b, 'he')); }
function threshold() { return (S.boot && S.boot.threshold) || 75; }
function pctColor(p) { return p >= Math.max(90, threshold()) ? 'var(--ok)' : p >= threshold() ? '#f59e0b' : 'var(--bad)'; }
function isLow(r) { return r.due >= 3 && r.present / r.due * 100 < threshold(); }
function pctCell(num, den) {
  if (!den) return '<span class="muted">—</span>';
  const p = Math.min(100, Math.round(num / den * 100));
  return `<div class="pct"><div class="bar"><i style="width:${p}%;background:${pctColor(p)}"></i></div><b style="color:${pctColor(p)}">${p}%</b></div>`;
}
function studentsText(list) { return list.map(s => s.name + (s.className ? ` (${s.className})` : '')).join(', '); }

/* ============================== כניסה ============================== */
function showLogin() {
  document.getElementById('tabs').innerHTML = '';
  document.getElementById('userbox').innerHTML = '';
  const L = S.login;
  document.getElementById('app').innerHTML = `
    <div class="card login">
      <h2>כניסה למערכת</h2>
      ${window.API_URL && isIOS() && !isStandalone() ? `
        <div class="alert warn small"><b>באייפון:</b> הכניסה נשמרת רק באפליקציה שבמסך הבית, ולא בספארי.
        קודם מוסיפים למסך הבית (כפתור השיתוף <span class="ios-share">⬆︎</span> ← "הוספה למסך הבית"), פותחים מהאייקון "סל אישי", ונכנסים משם.</div>` : ''}
      ${L.step === 'email' ? `
        <p class="muted">יש להזין את כתובת המייל הרשומה במערכת. יישלח אלייך קוד כניסה.</p>
        <label class="f">כתובת מייל</label>
        <input type="email" id="lg-email" value="${h(L.email)}" dir="ltr" autocomplete="email">
        <div class="form-actions"><button class="btn pri" data-a="login-send">שליחת קוד</button></div>
      ` : `
        <p class="muted">נשלח קוד בן 6 ספרות אל <b dir="ltr">${h(L.email)}</b></p>
        <label class="f">קוד כניסה</label>
        <input type="text" id="lg-code" inputmode="numeric" maxlength="6" dir="ltr" autocomplete="one-time-code">
        <div class="form-actions"><button class="btn pri" data-a="login-verify">כניסה</button></div>
        <button class="btn ghost" data-a="login-back">שינוי כתובת / שליחה מחדש</button>
      `}
    </div>`;
  const el = document.getElementById(L.step === 'email' ? 'lg-email' : 'lg-code');
  if (el) el.focus();
}

/** נועל את כפתור הכניסה בזמן שהבקשה בדרך, כדי שלחיצה כפולה לא תשלח פעמיים. */
let loginBusy = false;
function lockLogin(action, text) {
  loginBusy = true;
  const b = document.querySelector(`[data-a="${action}"]`);
  if (b) { b.disabled = true; b.dataset.label = b.textContent; b.textContent = text; }
}
function unlockLogin(action) {
  loginBusy = false;
  const b = document.querySelector(`[data-a="${action}"]`);
  if (b) { b.disabled = false; if (b.dataset.label) b.textContent = b.dataset.label; }
}

async function loginSend() {
  if (loginBusy) return;
  const email = document.getElementById('lg-email').value.trim();
  if (!email) return toast('יש להזין מייל', true);
  S.login.email = email;
  lockLogin('login-send', 'שולחת קוד…');
  try { await call('sendCode', { email }); loginBusy = false; S.login.step = 'code'; showLogin(); }
  catch (e) { unlockLogin('login-send'); fail(e); }
}
async function loginVerify() {
  if (loginBusy) return;
  const code = document.getElementById('lg-code').value.trim();
  if (!/^\d{6}$/.test(code)) return toast('יש להזין את 6 הספרות מהמייל', true);
  lockLogin('login-verify', 'בודקת…');
  try {
    const r = await call('verify', { email: S.login.email, code });
    setToken(r.token);
    keepStorage();
    S.login = { step: 'email', email: '' };
    loginBusy = false;
    init();
  } catch (e) { unlockLogin('login-verify'); fail(e); }
}
/** מבקש מהדפדפן לא למחוק את הכניסה השמורה גם כשהזיכרון בטלפון מתמלא. */
function keepStorage() {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
}

function confirmLogout() {
  openModal(`<h3>התנתקות מהחשבון</h3>
    <p>אחרי התנתקות, בכניסה הבאה יהיה צריך לקבל קוד חדש למייל.</p>
    <p class="muted small">כדי רק לסגור את האפליקציה אין צורך להתנתק. אפשר פשוט לצאת ממנה, והכניסה תישמר.</p>
    <div class="form-actions"><button class="btn danger" data-a="logout-yes">להתנתק</button><button class="btn pri" data-a="modal-close">ביטול</button></div>`);
}

async function logout() {
  try { await call('logout'); } catch (e) {}
  setToken('');
  location.reload();
}

/* ============================== התקנה כאפליקציה (רק בגרסה המותקנת) ============================== */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; showInstall(); });
window.addEventListener('appinstalled', () => { installEvt = null; hideInstall(); });

function isStandalone() { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function installDismissed() { try { return Number(localStorage.getItem('sal_install_dismissed') || 0) > Date.now(); } catch (e) { return false; } }

function showInstall() {
  if (!window.API_URL || isStandalone() || installDismissed()) return;
  if (!installEvt && !isIOS()) return;
  let bar = document.getElementById('install-bar');
  if (!bar) { bar = document.createElement('div'); bar.id = 'install-bar'; document.body.appendChild(bar); }
  bar.innerHTML = installEvt
    ? `<div class="grow"><b>📲 התקנת האפליקציה בטלפון</b><div class="small">כך תיכנסי בלחיצה אחת ממסך הבית</div></div>
       <button class="btn pri" data-a="install-now">התקנה</button><button class="btn ghost" data-a="install-later">לא עכשיו</button>`
    : `<div class="grow"><b>📲 התקנת האפליקציה באייפון</b>
         <div class="small">בספארי: לוחצים על כפתור השיתוף <span class="ios-share">⬆︎</span> בתחתית המסך ← <b>"הוספה למסך הבית"</b> ← "הוסף". אחר כך נכנסים מהאייקון שנוצר.</div></div>
       <button class="btn ghost" data-a="install-later">סגירה</button>`;
}
function hideInstall() { const b = document.getElementById('install-bar'); if (b) b.remove(); }
async function installNow() {
  if (!installEvt) return;
  installEvt.prompt();
  const choice = await installEvt.userChoice.catch(() => null);
  installEvt = null;
  hideInstall();
  if (choice && choice.outcome === 'accepted') toast('האפליקציה הותקנה ✓');
}
function installLater() {
  try { localStorage.setItem('sal_install_dismissed', String(Date.now() + 7 * 24 * 3600 * 1000)); } catch (e) {}
  hideInstall();
}

/* ============================== מבנה כללי ============================== */
function tabsFor() {
  const u = S.boot.user, t = [];
  if (u.role === ROLE_TEACHER || u.role === ROLE_COORD || S.boot.hasLessons) t.push(['day', u.role === ROLE_COORD ? 'דיווח שיעורים' : 'השיעורים שלי']);
  if (canView()) t.push(['dash', 'לוח בקרה'], ['rep', 'דוחות']);
  t.push(['sched', canView() ? 'מערכת שעות' : 'המערכת שלי']);
  if (isCoord()) t.push(['admin', 'ניהול']);
  return t;
}

async function init() {
  try {
    S.boot = await call('bootstrap', { appUrl: window.API_URL ? location.href : '' });
    S.today = S.boot.today;
    S.day.date = S.today;
    S.day.teacher = S.boot.user.email;
    document.getElementById('userbox').innerHTML = `<span>${h(S.boot.user.name)} · ${h(S.boot.user.role)}</span><button data-a="logout">התנתקות</button>`;
    keepStorage();
    const tabs = tabsFor();
    let saved = ''; try { saved = localStorage.getItem('sal_tab') || ''; } catch (e) {}
    const start = tabs.some(t => t[0] === saved) ? saved : (canView() && !S.boot.hasLessons ? 'dash' : tabs[0][0]);
    go(start);
  } catch (e) {
    if (!e.auth) document.getElementById('app').innerHTML = `<div class="alert bad">${h(e.message)}</div>`;
  }
}

function go(tab) {
  S.tab = tab;
  try { localStorage.setItem('sal_tab', tab); } catch (e) {}
  document.getElementById('tabs').innerHTML = tabsFor().map(([k, l]) => `<button class="${k === tab ? 'on' : ''}" data-a="tab" data-v="${k}">${l}</button>`).join('');
  document.getElementById('app').innerHTML = '<div class="empty">טוען…</div>';
  ({ day: loadDay, dash: loadDash, rep: loadReports, sched: loadSched, admin: loadAdmin })[tab]();
}

/* ============================== השיעורים שלי / דיווח ============================== */
async function loadDay() {
  try {
    S.day.data = await call('myDay', { date: S.day.date, teacherEmail: S.day.teacher });
    S.forms = {};
    renderDay();
  } catch (e) { fail(e); }
}

function allDayLessons() { const d = S.day.data; return d ? d.lessons.concat(d.missing) : []; }
function findLesson(id) { return allDayLessons().find(l => l.id === id); }

function renderDay() {
  const d = S.day.data, date = S.day.date;
  const isToday = date === S.today;
  let html = '';
  if (isCoord()) {
    html += `<div class="card"><label class="f" style="margin-top:0">דיווח עבור</label>
      <select data-a="day-teacher">${S.boot.teachers.filter(t => t.role !== ROLE_MANAGER).map(t => opt(t.email, t.name + (t.email === S.boot.user.email ? ' (אני)' : ''), S.day.teacher)).join('')}</select></div>`;
  }
  if (d.missing.length) {
    html += `<div class="alert bad"><b>${d.missing.length === 1 ? 'יש שיעור אחד שעדיין לא דווח' : `יש ${d.missing.length} שיעורים שעדיין לא דווחו`}</b> מהשבועות האחרונים. אפשר לדווח עליהם למטה.</div>`;
  }
  html += `<div class="datebar">
      <button class="btn sm" data-a="day-move" data-v="-1">→ הקודם</button>
      <div class="label">${isToday ? 'היום, ' : ''}${fmtDate(date)}</div>
      <button class="btn sm" data-a="day-move" data-v="1">הבא ←</button>
    </div>
    <div class="row" style="justify-content:center;margin-bottom:12px">
      <input type="date" value="${date}" data-a="day-pick" style="max-width:180px">
      ${isToday ? '' : '<button class="btn sm" data-a="day-today">חזרה להיום</button>'}
    </div>`;
  html += d.lessons.length ? d.lessons.map(l => lessonCard(l, false)).join('')
    : `<div class="empty">${weekday(date) === 6 ? 'שבת שלום 🙂' : 'אין שיעורים מתוכננים ביום זה'}</div>`;
  if (d.missing.length) {
    html += `<h3>ממתינים לדיווח מימים קודמים</h3>` + d.missing.map(l => lessonCard(l, true)).join('');
  }
  document.getElementById('app').innerHTML = html;
}

function statusInfo(l) {
  if (!l.status) {
    if (l.date < S.today) return { cls: 'missing', text: 'טרם דווח' };
    if (l.date === S.today) return { cls: 'pending', text: 'ממתין לדיווח' };
    return { cls: 'future', text: 'מתוכנן' };
  }
  if (l.status === HELD) {
    const n = l.students.length, abs = l.students.filter(s => s.present === false).length;
    if (!abs) return { cls: 'ok', text: n > 1 ? 'התקיים · כולן נכחו' : 'התקיים · נכחה' };
    if (abs === n) return { cls: 'warn', text: n > 1 ? 'התקיים · אף אחת לא נכחה' : 'התקיים · לא נכחה' };
    return { cls: 'warn', text: `התקיים · ${n - abs} מתוך ${n} נכחו` };
  }
  if (l.status === NOT_HELD) return { cls: 'bad', text: 'לא התקיים' };
  return { cls: 'info', text: l.makeupDate ? 'נדחה ל' + fmtDate(l.makeupDate) : 'נדחה' };
}

function lessonSummary(l) {
  if (!l.status) return '';
  const parts = [];
  if (l.reason) parts.push('סיבה: ' + l.reason + (l.reasonText ? ' – ' + l.reasonText : ''));
  l.students.filter(s => s.present === false).forEach(s => {
    parts.push((l.students.length > 1 ? s.name + ' נעדרה: ' : 'סיבת היעדרות: ') + (s.reason || '') + (s.reasonText ? ' – ' + s.reasonText : ''));
  });
  if (l.topic) parts.push('נלמד: ' + l.topic);
  if (l.note) parts.push('הערה: ' + l.note);
  const who = l.reportedAt ? `<div class="who">דווח ${l.reportedByOther ? 'ע״י ' + h(l.reportedByName) + ' ' : ''}ב־${h(fmtStamp(l.reportedAt))}</div>` : '';
  return (parts.length ? `<div class="lesson-sum">${parts.map(h).join('<br>')}</div>` : '') + who;
}

function lessonCard(l, showDate) {
  const st = statusInfo(l);
  const f = S.forms[l.id];
  const future = l.date > S.today;
  return `<div class="card lesson s-${st.cls}" id="L-${h(l.id)}">
    <div class="lesson-head">
      <div class="lesson-time">${h(l.time)}</div>
      <div class="grow">
        <div class="lesson-subj">${h(l.subject)}${showDate ? `<span class="tag">${fmtDate(l.date)}</span>` : ''}${l.kind === 'השלמה' ? `<span class="tag">השלמה${l.makeupOfDate ? ' לשיעור מ' + fmtDate(l.makeupOfDate) : ''}</span>` : ''}${l.students.length > 1 ? '<span class="tag">קבוצתי</span>' : ''}</div>
        <div class="lesson-studs">${h(studentsText(l.students))}</div>
      </div>
      <span class="badge b-${st.cls}">${h(st.text)}</span>
    </div>
    ${f && f.open ? renderForm(l) : lessonSummary(l) + (future ? '' : `<div class="row" style="margin-top:10px"><button class="btn ${l.status ? 'sm' : 'pri'}" data-a="open-form" data-id="${h(l.id)}">${l.status ? 'עריכת דיווח' : 'דיווח על השיעור'}</button></div>`)}
  </div>`;
}

function formFor(l) {
  if (!S.forms[l.id]) {
    const att = {};
    l.students.forEach(s => { att[s.id] = { present: s.present !== false, reason: s.reason || '', reasonText: s.reasonText || '' }; });
    S.forms[l.id] = { open: false, status: l.status, reason: l.reason, reasonText: l.reasonText, topic: l.topic, note: l.note,
      makeupDate: l.makeupDate || '', makeupTime: l.makeupTime || l.time, att };
  }
  return S.forms[l.id];
}

function reasonSelect(list, value, attrs) {
  return `<select ${attrs}><option value="">בחרי סיבה…</option>${list.map(r => opt(r, r, value)).join('')}</select>`;
}

function renderForm(l) {
  const f = formFor(l), id = h(l.id);
  const single = l.students.length === 1, sid = l.students[0].id;
  const B = S.boot;
  let choice = '';
  if (f.status === HELD) choice = single ? (f.att[sid].present ? 'hp' : 'ha') : 'h';
  else if (f.status === NOT_HELD) choice = 'n';
  else if (f.status === POSTPONED) choice = 'p';
  const opts = single
    ? [['hp', 'התקיים – התלמידה נכחה', 'ok'], ['ha', 'התקיים – התלמידה לא נכחה', 'warn'], ['n', 'השיעור לא התקיים', 'bad'], ['p', 'נדחה / הועבר למועד אחר', 'info']]
    : [['h', 'התקיים', 'ok'], ['n', 'השיעור לא התקיים', 'bad'], ['p', 'נדחה / הועבר', 'info']];
  let html = `<div class="choices"${single ? '' : ' style="grid-template-columns:1fr 1fr 1fr"'}>` +
    opts.map(([v, label, c]) => `<button class="choice c-${c}${choice === v ? ' on' : ''}" data-a="choose" data-id="${id}" data-v="${v}">${label}</button>`).join('') + '</div>';

  if (f.status === HELD) {
    if (single) {
      const a = f.att[sid];
      if (!a.present) html += absenceFields(id, sid, a, B);
    } else {
      html += '<div style="margin-top:12px">' + l.students.map(s => {
        const a = f.att[s.id];
        return `<div class="stud-row"><div class="row"><div class="grow">${h(s.name)} <span class="muted small">${h(s.className)}</span></div>
          <div class="seg"><button class="p${a.present ? ' on' : ''}" data-a="att" data-id="${id}" data-sid="${h(s.id)}" data-v="1">נכחה</button><button class="a${!a.present ? ' on' : ''}" data-a="att" data-id="${id}" data-sid="${h(s.id)}" data-v="0">נעדרה</button></div></div>
          ${a.present ? '' : absenceFields(id, s.id, a, B)}</div>`;
      }).join('') + '</div>';
    }
    html += `<label class="f">מה נלמד בשיעור</label><input type="text" data-f="topic" data-id="${id}" value="${h(f.topic)}" placeholder="לדוגמה: שברים פשוטים">`;
  }
  if (f.status === NOT_HELD || f.status === POSTPONED) {
    html += `<label class="f">${f.status === NOT_HELD ? 'למה השיעור לא התקיים?' : 'סיבת הדחייה'}</label>` + reasonSelect(B.lessonReasons, f.reason, `data-f="reason" data-id="${id}"`);
    if (f.reason === B.otherReason) html += `<input type="text" style="margin-top:6px" data-f="reasonText" data-id="${id}" value="${h(f.reasonText)}" placeholder="פירוט הסיבה">`;
  }
  if (f.status === POSTPONED) {
    html += `<label class="f">המועד החדש (אם כבר נקבע)</label>
      <div class="row"><input type="date" class="grow" data-f="makeupDate" data-id="${id}" value="${h(f.makeupDate)}" min="${h(l.date)}" style="width:auto">
      <input type="time" data-f="makeupTime" data-id="${id}" value="${h(f.makeupTime)}" style="width:120px"></div>
      <div class="muted small" style="margin-top:4px">שיעור ההשלמה יופיע אצלך ביום שנבחר.</div>`;
  }
  if (f.status) html += `<label class="f">הערה (לא חובה)</label><input type="text" data-f="note" data-id="${id}" value="${h(f.note)}">`;
  html += `<div class="form-actions"><button class="btn pri" data-a="save-report" data-id="${id}"${f.status ? '' : ' disabled'}>שמירה</button><button class="btn" data-a="close-form" data-id="${id}">ביטול</button></div>`;
  return html;
}

function absenceFields(id, sid, a, B) {
  return `<label class="f">סיבת ההיעדרות</label>` + reasonSelect(B.absenceReasons, a.reason, `data-f="attReason" data-id="${id}" data-sid="${h(sid)}"`) +
    (a.reason === B.otherReason ? `<input type="text" style="margin-top:6px" data-f="attReasonText" data-id="${id}" data-sid="${h(sid)}" value="${h(a.reasonText)}" placeholder="פירוט">` : '');
}

function rerenderLesson(id) {
  const l = findLesson(id), el = document.getElementById('L-' + id);
  if (!l || !el) return;
  const showDate = S.day.data.missing.some(x => x.id === id);
  el.outerHTML = lessonCard(l, showDate);
}

async function saveReport(id) {
  const l = findLesson(id), f = S.forms[id];
  const payload = {
    id, status: f.status, reason: f.reason, reasonText: f.reasonText, topic: f.topic, note: f.note,
    makeupDate: f.status === POSTPONED ? f.makeupDate : '', makeupTime: f.makeupTime,
    attendance: l.students.map(s => ({ studentId: s.id, present: f.att[s.id].present, reason: f.att[s.id].reason, reasonText: f.att[s.id].reasonText })),
  };
  try { await call('report', payload); toast('הדיווח נשמר ✓'); loadDay(); } catch (e) { fail(e); }
}

/* ============================== טווחי תאריכים, מסננים וחישוב (משותף ללוח הבקרה ולדוחות) ============================== */
const PRESETS = [['week', 'השבוע'], ['lastweek', 'שבוע שעבר'], ['month', 'החודש'], ['lastmonth', 'חודש שעבר'], ['custom', 'טווח אחר']];

function presetRange(p, st) {
  const t = S.today, sow = addDays(t, -weekday(t));
  const [y, m] = t.split('-').map(Number);
  const monthStart = (yy, mm) => `${yy}-${String(mm).padStart(2, '0')}-01`;
  const monthEnd = (yy, mm) => addDays(mm === 12 ? monthStart(yy + 1, 1) : monthStart(yy, mm + 1), -1);
  if (p === 'week') return [sow, addDays(sow, 6)];
  if (p === 'lastweek') return [addDays(sow, -7), addDays(sow, -1)];
  if (p === 'month') return [monthStart(y, m), monthEnd(y, m)];
  if (p === 'lastmonth') { const yy = m === 1 ? y - 1 : y, mm = m === 1 ? 12 : m - 1; return [monthStart(yy, mm), monthEnd(yy, mm)]; }
  return [st.from, st.to];
}

async function loadRange(key) {
  const st = S[key];
  if (st.preset !== 'custom') [st.from, st.to] = presetRange(st.preset, st);
  try { st.data = await call('dashboard', { from: st.from, to: st.to }); (key === 'dash' ? renderDash : renderReports)(); } catch (e) { fail(e); }
}
function loadDash() { return loadRange('dash'); }

function rangeHtml(key) {
  const st = S[key];
  return `<div class="chips">${PRESETS.map(([k, l]) => `<button class="chip${st.preset === k ? ' on' : ''}" data-a="range-preset" data-k="${key}" data-v="${k}">${l}</button>`).join('')}</div>
    ${st.preset === 'custom' ? `<div class="row" style="margin-top:10px"><label class="small">מ־</label><input type="date" id="${key}-from" value="${st.from}" style="width:auto"><label class="small">עד</label><input type="date" id="${key}-to" value="${st.to}" style="width:auto"><button class="btn sm pri" data-a="range-custom" data-k="${key}">הצגה</button></div>` : ''}
    <div class="muted small" style="margin-top:8px">${fmtFull(st.data.from)} – ${fmtFull(st.data.to)}</div>`;
}

function filtersHtml(key, withStudent) {
  const st = S[key], d = st.data, f = st.f;
  const sel = (k, all, options) => `<select data-a="filter" data-s="${key}" data-k="${k}"><option value="">${all}</option>${options}</select>`;
  return `<div class="filters">
    ${withStudent ? sel('student', 'כל התלמידות', d.students.slice().sort((a, b) => a.name.localeCompare(b.name, 'he')).map(s => opt(s.id, s.name, f.student)).join('')) : ''}
    ${sel('className', 'כל הכיתות', uniq(d.students.map(s => s.className)).map(x => opt(x, x, f.className)).join(''))}
    ${sel('teacher', 'כל המורות', d.teachers.filter(t => t.role !== ROLE_MANAGER).map(t => opt(t.email, t.name, f.teacher)).join(''))}
    ${sel('subject', 'כל המקצועות', uniq(d.lessons.map(l => l.subject)).map(x => opt(x, x, f.subject)).join(''))}
  </div>`;
}

/** מחשב את כל המדדים מתוך רשימת השיעורים בטווח, לפי המסננים. */
function computeStats(d, f) {
  const today = d.today;
  const stuOk = s => (!f.student || s.id === f.student) && (!f.className || s.className === f.className);
  const lessons = d.lessons.filter(l => (!f.teacher || l.teacherEmail === f.teacher) && (!f.subject || l.subject === f.subject) && l.students.some(stuOk));
  const studentInfo = {}; d.students.forEach(s => { studentInfo[s.id] = s; });
  const per = {}, tot = { planned: 0, held: 0, present: 0, absent: 0, notHeld: 0, postponed: 0, missingL: 0, openMakeups: 0 };
  const lessonReasons = {}, absenceReasons = {}, teachers = {};
  const missing = [], openMakeups = [];
  const newRow = s => ({ s, planned: 0, due: 0, held: 0, present: 0, absent: 0, notHeld: 0, postponed: 0, missing: 0, reasons: {}, missingTeachers: {} });
  d.students.filter(s => s.active !== 'לא' && stuOk(s)).forEach(s => { per[s.id] = newRow(s); });
  const addReason = (m, r) => { if (r) m[r] = (m[r] || 0) + 1; };

  lessons.forEach(l => {
    const t = teachers[l.teacherEmail] = teachers[l.teacherEmail] || { name: l.teacherName, planned: 0, due: 0, reported: 0, held: 0, notHeld: 0, postponed: 0, missing: 0 };
    const sched = l.kind !== 'השלמה';
    const isMissing = !l.status && l.date < today;
    if (sched) t.planned++;
    if (l.status || l.date < today) t.due++;
    if (l.status) t.reported++;
    if (isMissing) { t.missing++; tot.missingL++; missing.push(l); }
    if (l.status === HELD) t.held++;
    if (l.status === NOT_HELD) { t.notHeld++; addReason(lessonReasons, l.reason); }
    if (l.status === POSTPONED) {
      t.postponed++; addReason(lessonReasons, l.reason);
      if (l.makeupStatus !== HELD && l.makeupStatus !== POSTPONED) { openMakeups.push(l); tot.openMakeups++; }
    }
    l.students.filter(stuOk).forEach(s => {
      const p = per[s.id] || (per[s.id] = newRow(studentInfo[s.id] || s));
      if (sched) { p.planned++; tot.planned++; if (l.status || l.date < today) p.due++; }
      if (isMissing) { p.missing++; p.missingTeachers[l.teacherName] = 1; }
      if (l.status === HELD) {
        p.held++; tot.held++;
        if (s.present === false) { p.absent++; tot.absent++; addReason(absenceReasons, s.reason); } else { p.present++; tot.present++; }
      }
      if (l.status === NOT_HELD) { p.notHeld++; tot.notHeld++; addReason(p.reasons, l.reason); }
      if (l.status === POSTPONED) { p.postponed++; tot.postponed++; addReason(p.reasons, l.reason); }
    });
  });
  const rows = Object.values(per).sort((a, b) => {
    const ra = a.due ? a.present / a.due : 2, rb = b.due ? b.present / b.due : 2;
    return ra - rb || a.s.name.localeCompare(b.s.name, 'he');
  });
  return { lessons, rows, tot, lessonReasons, absenceReasons, stuOk, teachers: Object.values(teachers).sort((a, b) => b.missing - a.missing || a.name.localeCompare(b.name, 'he')), missing, openMakeups };
}

function barsHtml(map, emptyText) {
  const e = Object.entries(map).sort((a, b) => b[1] - a[1]);
  if (!e.length) return `<div class="muted small">${emptyText}</div>`;
  const max = e[0][1];
  return '<div class="bars">' + e.map(([k, v]) => `<div class="b"><div class="t">${h(k)}</div><div class="track"><i style="width:${v / max * 100}%"></i></div><b>${v}</b></div>`).join('') + '</div>';
}

/* ============================== לוח בקרה ============================== */
function renderDash() {
  const D = S.dash, d = D.data;
  const c = computeStats(d, D.f);
  let html = `<div class="card">${rangeHtml('dash')}${filtersHtml('dash', true)}</div>`;

  const low = c.rows.filter(isLow);
  if (low.length) {
    html += `<div class="alert bad"><b>⚠ ${low.length === 1 ? 'תלמידה אחת' : low.length + ' תלמידות'} מתחת ל־${threshold()}% מימוש בתקופה הזו:</b> ` +
      low.map(r => `<a href="#" class="low-link" data-a="dash-student" data-v="${h(r.s.id)}">${h(r.s.name)} (${Math.round(r.present / r.due * 100)}%)</a>`).join(', ') + '</div>';
  }

  const T = c.tot;
  html += `<div class="kpis">
    <div class="kpi"><div class="v">${T.planned}</div><div class="l">שעות שתוכננו</div></div>
    <div class="kpi ok"><div class="v">${T.held}</div><div class="l">שעות שהתקיימו</div></div>
    <div class="kpi ok"><div class="v">${T.present}</div><div class="l">התלמידה נכחה</div></div>
    <div class="kpi warn"><div class="v">${T.absent}</div><div class="l">התלמידה נעדרה</div></div>
    <div class="kpi bad"><div class="v">${T.notHeld}</div><div class="l">לא התקיימו</div></div>
    <div class="kpi info"><div class="v">${T.postponed}</div><div class="l">נדחו</div></div>
    <div class="kpi bad"><div class="v">${T.missingL}</div><div class="l">דיווחים חסרים</div></div>
    <div class="kpi info"><div class="v">${T.openMakeups}</div><div class="l">השלמות פתוחות</div></div>
  </div>`;

  html += `<h3>מימוש לפי תלמידה</h3>
    <div class="muted small" style="margin-bottom:6px">אחוז המימוש הוא מספר השיעורים שבהם התלמידה נכחה, מתוך השיעורים שכבר היו אמורים להתקיים. התלמידות עם המימוש הנמוך ביותר מופיעות ראשונות. אפשר ללחוץ על שורה כדי לסנן לפיה.</div>
    <div class="tbl-wrap"><table><thead><tr>
      <th class="first">תלמידה</th><th>כיתה</th><th class="num">סל שבועי</th><th class="num">משובצות</th><th class="num">תוכננו</th><th class="num">התקיימו</th><th class="num">נכחה</th><th class="num">נעדרה</th><th class="num">לא התקיימו</th><th class="num">נדחו</th><th class="num">לא דווחו</th><th>מימוש</th>
    </tr></thead><tbody>` +
    (c.rows.length ? c.rows.map(r => {
      const s = r.s, mismatch = s.approvedHours && s.scheduledWeekly !== s.approvedHours;
      return `<tr class="click${isLow(r) ? ' low' : ''}" data-a="dash-student" data-v="${h(s.id)}"><td class="first">${h(s.name)}</td><td>${h(s.className)}</td>
        <td class="num">${s.approvedHours || '—'}</td><td class="num">${mismatch ? `<span class="badge b-warn" title="מספר השעות המשובצות שונה מהסל שאושר">${s.scheduledWeekly} ⚠</span>` : (s.scheduledWeekly || 0)}</td>
        <td class="num">${r.planned}</td><td class="num">${r.held}</td><td class="num">${r.present}</td><td class="num">${r.absent || ''}</td><td class="num">${r.notHeld || ''}</td><td class="num">${r.postponed || ''}</td>
        <td class="num">${r.missing ? `<span class="badge b-bad">${r.missing}</span>` : ''}</td><td>${pctCell(r.present, r.due)}</td></tr>`;
    }).join('') : '<tr><td colspan="12" class="empty">אין נתונים בטווח הזה</td></tr>') + '</tbody></table></div>';

  html += `<h3>לפי מורה</h3><div class="tbl-wrap"><table><thead><tr>
      <th class="first">מורה</th><th class="num">שיעורים שתוכננו</th><th class="num">דווחו</th><th class="num">לא דווחו</th><th class="num">התקיימו</th><th class="num">לא התקיימו</th><th class="num">נדחו</th><th>השלמת דיווח</th>
    </tr></thead><tbody>` +
    (c.teachers.length ? c.teachers.map(t => `<tr><td class="first">${h(t.name)}</td><td class="num">${t.planned}</td><td class="num">${t.reported}</td>
      <td class="num">${t.missing ? `<span class="badge b-bad">${t.missing}</span>` : '0'}</td><td class="num">${t.held}</td><td class="num">${t.notHeld || ''}</td><td class="num">${t.postponed || ''}</td><td>${pctCell(t.reported, t.due)}</td></tr>`).join('')
      : '<tr><td colspan="8" class="empty">אין נתונים</td></tr>') + '</tbody></table></div>';

  html += `<div class="two" style="margin-top:8px">
    <div><h3>למה שיעורים לא התקיימו או נדחו</h3><div class="card">${barsHtml(c.lessonReasons, 'אין שיעורים שבוטלו או נדחו')}</div></div>
    <div><h3>סיבות היעדרות של תלמידות</h3><div class="card">${barsHtml(c.absenceReasons, 'אין היעדרויות')}</div></div>
  </div>`;

  html += `<h3>דיווחים חסרים (${c.missing.length})</h3>` + (c.missing.length
    ? `<div class="tbl-wrap"><table><thead><tr><th>תאריך</th><th>שעה</th><th>מורה</th><th>מקצוע</th><th>תלמידות</th></tr></thead><tbody>` +
      c.missing.map(l => `<tr><td>${fmtDate(l.date)}</td><td>${h(l.time)}</td><td>${h(l.teacherName)}</td><td>${h(l.subject)}</td><td>${h(studentsText(l.students))}</td></tr>`).join('') + '</tbody></table></div>'
    : '<div class="card muted">כל השיעורים דווחו 👍</div>');

  html += `<h3>השלמות פתוחות (${c.openMakeups.length})</h3>` + (c.openMakeups.length
    ? `<div class="tbl-wrap"><table><thead><tr><th>שיעור מקורי</th><th>מורה</th><th>מקצוע</th><th>תלמידות</th><th>מצב ההשלמה</th></tr></thead><tbody>` +
      c.openMakeups.map(l => `<tr><td>${fmtDate(l.date)}</td><td>${h(l.teacherName)}</td><td>${h(l.subject)}</td><td>${h(studentsText(l.students))}</td>
        <td>${!l.makeupDate ? '<span class="badge b-warn">לא נקבע מועד</span>' : l.makeupStatus === NOT_HELD ? '<span class="badge b-bad">ההשלמה לא התקיימה</span>' : `<span class="badge b-info">נקבעה ל${fmtDate(l.makeupDate)}</span>`}</td></tr>`).join('') + '</tbody></table></div>'
    : '<div class="card muted">אין השלמות פתוחות</div>');

  html += `<details class="card" style="margin-top:16px"><summary>פירוט כל השיעורים בטווח (${c.lessons.length})</summary><div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>תאריך</th><th>שעה</th><th>מורה</th><th>מקצוע</th><th>תלמידות</th><th>מצב</th><th>נושא / סיבה</th></tr></thead><tbody>` +
    c.lessons.map(l => { const st = statusInfo(l); return `<tr><td>${fmtDate(l.date)}</td><td>${h(l.time)}</td><td>${h(l.teacherName)}</td><td>${h(l.subject)}${l.kind === 'השלמה' ? ' <span class="tag">השלמה</span>' : ''}</td><td>${h(studentsText(l.students))}</td><td><span class="badge b-${st.cls}">${h(st.text)}</span></td><td style="white-space:normal;min-width:180px">${h(l.topic || (l.reason ? l.reason + (l.reasonText ? ' – ' + l.reasonText : '') : ''))}</td></tr>`; }).join('') +
    '</tbody></table></div></details>';

  document.getElementById('app').innerHTML = html;
}

/* ============================== דוחות ============================== */
function loadReports() { return loadRange('rep'); }

function reasonsText(m) { return Object.entries(m).sort((a, b) => b[1] - a[1]).map(([k, v]) => v > 1 ? `${k} (${v})` : k).join('; '); }
function pctText(n, d) { return d ? Math.min(100, Math.round(n / d * 100)) + '%' : '—'; }
function withText(r, t) { return r ? r + (t ? ' – ' + t : '') : ''; }

/** בונה את טבלאות הדוח כמערכים – משמשות גם לתצוגה/הדפסה וגם לייצוא. */
function reportTables(c, d) {
  const T = {};
  T.students = {
    name: 'לפי תלמידה',
    head: ['תלמידה', 'כיתה', 'סל שבועי', 'תוכננו', 'התקיימו', 'נכחה', 'נעדרה', 'לא התקיימו', 'נדחו', 'סיבות ביטול / דחייה', 'לא דווחו', 'מורות שטרם דיווחו', 'מימוש'],
    rows: c.rows.slice().sort((a, b) => a.s.className.localeCompare(b.s.className, 'he') || a.s.name.localeCompare(b.s.name, 'he')).map(r => [
      r.s.name, r.s.className, r.s.approvedHours || 0, r.planned, r.held, r.present, r.absent, r.notHeld, r.postponed,
      reasonsText(r.reasons), r.missing, Object.keys(r.missingTeachers).join(', '), pctText(r.present, r.due)]),
  };
  T.teachers = {
    name: 'לפי מורה',
    head: ['מורה', 'שיעורים שתוכננו', 'דווחו', 'לא דווחו', 'התקיימו', 'לא התקיימו', 'נדחו', 'השלמת דיווח'],
    rows: c.teachers.slice().sort((a, b) => a.name.localeCompare(b.name, 'he')).map(t => [t.name, t.planned, t.reported, t.missing, t.held, t.notHeld, t.postponed, pctText(t.reported, t.due)]),
  };
  T.missing = {
    name: 'דיווחים חסרים',
    head: ['מורה', 'תאריך', 'יום', 'שעה', 'מקצוע', 'תלמידות'],
    rows: c.missing.slice().sort((a, b) => a.teacherName.localeCompare(b.teacherName, 'he') || (a.date < b.date ? -1 : 1))
      .map(l => [l.teacherName, fmtFull(l.date), DAY_LETTERS[weekday(l.date)], l.time, l.subject, studentsText(l.students)]),
  };
  T.lessons = {
    name: 'פירוט שיעורים',
    head: ['תאריך', 'יום', 'שעה', 'מורה', 'מקצוע', 'סוג', 'תלמידה', 'כיתה', 'מצב השיעור', 'נוכחות', 'סיבה', 'נושא השיעור', 'הערה'],
    rows: [],
  };
  c.lessons.forEach(l => l.students.filter(c.stuOk).forEach(s => {
    const st = !l.status ? (l.date < d.today ? 'טרם דווח' : 'מתוכנן') : l.status === POSTPONED && l.makeupDate ? 'נדחה ל' + fmtFull(l.makeupDate) : l.status;
    const att = l.status === HELD ? (s.present === false ? 'נעדרה' : 'נכחה') : '';
    const reason = l.status === HELD ? (s.present === false ? withText(s.reason, s.reasonText) : '') : withText(l.reason, l.reasonText);
    T.lessons.rows.push([fmtFull(l.date), DAY_LETTERS[weekday(l.date)], l.time, l.teacherName, l.subject, l.kind === 'השלמה' ? 'השלמה' : (l.students.length > 1 ? 'קבוצתי' : 'פרטני'),
      s.name, s.className, st, att, reason, l.topic, l.note]);
  }));
  return T;
}

function tableHtml(t, numCols) {
  if (!t.rows.length) return '<div class="card muted">אין נתונים</div>';
  const isNum = i => numCols && numCols.includes(i);
  return `<div class="tbl-wrap"><table><thead><tr>${t.head.map((x, i) => `<th${isNum(i) ? ' class="num"' : ''}>${h(x)}</th>`).join('')}</tr></thead><tbody>` +
    t.rows.map(r => `<tr>${r.map((v, i) => `<td${isNum(i) ? ' class="num"' : ''}${typeof v === 'string' && v.length > 25 ? ' style="white-space:normal;min-width:160px"' : ''}>${v === 0 && isNum(i) ? '<span class="muted">0</span>' : h(v)}</td>`).join('')}</tr>`).join('') +
    '</tbody></table></div>';
}

function reportModel() {
  const R = S.rep, d = R.data;
  const f = Object.assign({}, R.f, R.view === 'student' ? { student: R.student } : {});
  const c = computeStats(d, f);
  const T = reportTables(c, d);
  const period = `${fmtFull(d.from)} – ${fmtFull(d.to)}`;
  const filt = [R.f.className && 'כיתה ' + R.f.className, R.f.teacher && (d.teachers.find(t => t.email === R.f.teacher) || {}).name, R.f.subject].filter(Boolean).join(' · ');
  let title, sheets;
  if (R.view === 'students') { title = 'דוח מימוש שעות סל אישי – לפי תלמידה'; sheets = [T.students, T.teachers, T.missing, T.lessons]; }
  else if (R.view === 'teachers') { title = 'דוח דיווחי מורות'; sheets = [T.teachers, T.missing, T.students, T.lessons]; }
  else { const s = d.students.find(x => x.id === R.student); title = 'דוח שעות סל אישי – ' + (s ? s.name : ''); sheets = [T.students, T.lessons]; }
  return { c, T, title, period, filt, sheets };
}

function renderReports() {
  const R = S.rep, d = R.data;
  const views = [['students', 'סיכום לפי תלמידה'], ['teachers', 'דיווחי מורות'], ['student', 'דוח לתלמידה']];
  if (R.view === 'student' && !R.student) {
    const first = d.students.filter(s => s.active !== 'לא').sort((a, b) => a.name.localeCompare(b.name, 'he'))[0];
    R.student = first ? first.id : '';
  }
  const M = reportModel(), T = M.T;
  let html = `<div class="card no-print">
    <div class="chips" style="margin-bottom:10px">${views.map(([k, l]) => `<button class="chip${R.view === k ? ' on' : ''}" data-a="rep-view" data-v="${k}">${l}</button>`).join('')}</div>
    ${R.view === 'student' ? `<select data-a="rep-student" style="margin-bottom:10px">${d.students.slice().sort((a, b) => a.name.localeCompare(b.name, 'he')).map(s => opt(s.id, s.name + (s.className ? ' – ' + s.className : ''), R.student)).join('')}</select>` : ''}
    ${rangeHtml('rep')}${R.view === 'student' ? '' : filtersHtml('rep', false)}
    <div class="row" style="margin-top:12px">
      <button class="btn pri" data-a="rep-print">🖨️ הדפסה</button>
      <button class="btn" data-a="rep-xlsx">⬇️ ייצוא לאקסל</button>
      <button class="btn" data-a="rep-gsheet">פתיחה כגיליון Google</button>
    </div>
    <div class="muted small" style="margin-top:6px">קובץ האקסל כולל את כל הטבלאות של הדוח בלשוניות נפרדות. אם ההורדה לא מתחילה, אפשר לבחור "פתיחה כגיליון Google" ומשם להוריד כאקסל.</div>
  </div>`;

  html += `<div class="report"><div class="report-head"><h2>${h(M.title)}</h2>
    <div class="muted small">תקופה: ${M.period}${M.filt ? ' · ' + h(M.filt) : ''} · הופק ב־${fmtFull(S.today)}</div></div>`;

  const sum = M.c.tot;
  const sumLine = `<div class="kpis report-kpis">
      <div class="kpi"><div class="v">${sum.planned}</div><div class="l">שעות שתוכננו</div></div>
      <div class="kpi ok"><div class="v">${sum.held}</div><div class="l">התקיימו</div></div>
      <div class="kpi ok"><div class="v">${sum.present}</div><div class="l">נכחה</div></div>
      <div class="kpi warn"><div class="v">${sum.absent}</div><div class="l">נעדרה</div></div>
      <div class="kpi bad"><div class="v">${sum.notHeld}</div><div class="l">לא התקיימו</div></div>
      <div class="kpi info"><div class="v">${sum.postponed}</div><div class="l">נדחו</div></div>
      <div class="kpi bad"><div class="v">${sum.missingL}</div><div class="l">לא דווחו</div></div>
    </div>`;

  if (R.view === 'students') {
    html += sumLine + `<h3>סיכום לפי תלמידה</h3>` + tableHtml(T.students, [2, 3, 4, 5, 6, 7, 8, 10]);
    html += `<h3>מורות – השלמת דיווח</h3>` + tableHtml(T.teachers, [1, 2, 3, 4, 5, 6]);
  } else if (R.view === 'teachers') {
    html += `<h3>סיכום לפי מורה</h3>` + tableHtml(T.teachers, [1, 2, 3, 4, 5, 6]);
    html += `<h3>שיעורים שטרם דווחו (${T.missing.rows.length})</h3>` + (T.missing.rows.length ? tableHtml(T.missing) : '<div class="card muted">כל השיעורים המתוכננים דווחו 👍</div>');
  } else {
    const s = d.students.find(x => x.id === R.student);
    if (s) {
      const r = M.c.rows.find(x => x.s.id === s.id);
      html += `<div class="card"><b>${h(s.name)}</b> · כיתה ${h(s.className)} · סל שבועי: ${s.approvedHours} שעות · משובצות כרגע: ${s.scheduledWeekly}
        ${r ? `<div style="margin-top:6px">מימוש בתקופה: <b>${pctText(r.present, r.due)}</b> (נכחה ב־${r.present} מתוך ${r.due} שיעורים שהיו אמורים להתקיים)</div>` : ''}
        ${r && Object.keys(r.reasons).length ? `<div class="small" style="margin-top:4px">סיבות ביטול / דחייה: ${h(reasonsText(r.reasons))}</div>` : ''}
        ${r && r.missing ? `<div class="small" style="margin-top:4px;color:var(--bad)">לא דווחו ${r.missing} שיעורים (${h(Object.keys(r.missingTeachers).join(', '))})</div>` : ''}</div>`;
      html += sumLine;
      html += `<h3>פירוט השיעורים</h3>` + tableHtml({ head: T.lessons.head.filter((_, i) => i !== 6 && i !== 7), rows: T.lessons.rows.map(row => row.filter((_, i) => i !== 6 && i !== 7)) });
    }
  }
  html += '</div>';
  document.getElementById('app').innerHTML = html;
}

/* ---------- שעות המערכת (שעה 1, שעה 2...) ---------- */
const DEFAULT_PERIODS = [
  { start: '08:30', end: '09:15' }, { start: '09:15', end: '10:00' }, { start: '10:30', end: '11:15' },
  { start: '11:15', end: '12:00' }, { start: '12:10', end: '12:55' }, { start: '12:55', end: '13:40' },
  { start: '14:00', end: '14:45', bStart: '14:20', bEnd: '15:05' }, { start: '14:45', end: '15:30', bStart: '15:05', bEnd: '15:50' },
];
function periods() { return (S.boot && S.boot.periods && S.boot.periods.length) ? S.boot.periods : DEFAULT_PERIODS; }
function boardingDay() { return S.boot && S.boot.boardingDay != null ? S.boot.boardingDay : ''; }
/** שעות המערכת של יום מסוים – ביום פנימיה חלק מהשעות זזות. */
function periodsFor(day) {
  const bd = boardingDay();
  return periods().map(p => day && day === bd && p.bStart && p.bEnd ? { start: p.bStart, end: p.bEnd } : { start: p.start, end: p.end });
}
function padT(t) { const [a, b] = String(t || '').split(':'); return a ? a.padStart(2, '0') + ':' + (b || '00').padStart(2, '0') : ''; }
function shortT(t) { return String(t || '').replace(/^0(\d)/, '$1'); }
/** לאיזו שעת מערכת שייך שיעור שמתחיל בשעה הזו (-1 אם לאף אחת). */
function periodOf(time, day) {
  const t = padT(time), ps = periodsFor(day);
  let i = ps.findIndex(p => p.start === t);
  if (i < 0) i = ps.findIndex(p => t >= p.start && t < p.end);
  return i;
}
function periodRange(i, day) { const p = periodsFor(day)[i]; return p ? '⁦' + shortT(p.start) + '–' + shortT(p.end) + '⁩' : ''; }
function whenText(day, time) {
  const i = periodOf(time, day);
  return `יום ${day}, ` + (i >= 0 ? `שעה ${i + 1} · ${periodRange(i, day)}` : `בשעה ${shortT(time)}`);
}

/** צבע קבוע לכל מקצוע. */
const SUBJ_COLORS = [['#e0f2fe', '#0284c7'], ['#fef3c7', '#d97706'], ['#ede9fe', '#7c3aed'], ['#dcfce7', '#16a34a'],
  ['#fce7f3', '#db2777'], ['#ffedd5', '#ea580c'], ['#e0e7ff', '#4f46e5'], ['#ccfbf1', '#0d9488'], ['#f1f5f9', '#475569']];
function subjColor(subject, all) {
  const i = Math.max(0, all.indexOf(subject));
  return SUBJ_COLORS[i % SUBJ_COLORS.length];
}

function overlaps(a, b) {
  return (a.validFrom || '') <= (b.validTo || '9999') && (b.validFrom || '') <= (a.validTo || '9999');
}
/** שיבוצים שמתנגשים: אותה מורה, או אותה תלמידה, באותו יום ובאותה שעת מערכת. */
function conflictsOf(slot, all) {
  const p = periodOf(slot.time, slot.day);
  const ids = slot.studentIds.split(',');
  return all.filter(o => o.id !== slot.id && o.day === slot.day && overlaps(o, slot) &&
    (p >= 0 ? periodOf(o.time, o.day) === p : padT(o.time) === padT(slot.time)) &&
    (o.teacherEmail === slot.teacherEmail || o.studentIds.split(',').some(id => ids.includes(id))));
}

const isNarrow = () => window.innerWidth < 700;

/* ============================== מערכת שעות ============================== */
async function loadSched() {
  try { S.sched.data = await call('schedule', { date: S.sched.date || S.today }); renderSched(); } catch (e) { fail(e); }
}

function renderSched() {
  const d = S.sched.data, Q = S.sched, B = S.boot;
  const stu = {}; d.students.forEach(s => { stu[s.id] = s; });
  const tName = {}; d.teachers.forEach(t => { tName[t.email] = t.name; });
  const all = d.slots.filter(s => !s.validTo || s.validTo >= S.today);
  const subjects = uniq(all.map(s => s.subject));
  const edit = isCoord();
  let html = '';

  // מה מציגים: תלמידה אחת או מורה אחת
  let mode = canView() ? Q.view : 'teacher';
  const students = d.students.filter(s => s.active !== 'לא').sort((a, b) => a.className.localeCompare(b.className, 'he') || a.name.localeCompare(b.name, 'he'));
  const teachers = d.teachers.filter(t => t.role !== ROLE_MANAGER);
  let list, key;
  if (mode === 'student') {
    list = students.map(s => [s.id, s.name + ' · ' + s.className]);
    if (!list.some(x => x[0] === Q.student)) Q.student = list.length ? list[0][0] : '';
    key = Q.student;
  } else {
    list = canView() ? teachers.map(t => [t.email, t.name]) : [[B.user.email, B.user.name]];
    if (!list.some(x => x[0] === Q.teacher)) Q.teacher = canView() ? (list.length ? list[0][0] : '') : B.user.email;
    key = Q.teacher;
  }

  if (canView()) {
    const idx = list.findIndex(x => x[0] === key);
    html += `<div class="card no-print"><div class="tt-bar">
      <div class="chips"><button class="chip${mode === 'student' ? ' on' : ''}" data-a="tt-view" data-v="student">לפי תלמידה</button><button class="chip${mode === 'teacher' ? ' on' : ''}" data-a="tt-view" data-v="teacher">לפי מורה</button></div>
      <button class="btn sm" data-a="tt-step" data-v="-1"${idx <= 0 ? ' disabled' : ''} title="הקודמת">→</button>
      <select data-a="tt-pick">${list.map(([k, l]) => opt(k, l, key)).join('')}</select>
      <button class="btn sm" data-a="tt-step" data-v="1"${idx < 0 || idx >= list.length - 1 ? ' disabled' : ''} title="הבאה">←</button>
    </div></div>`;
  }
  if (!key) {
    html += `<div class="empty">${mode === 'student' ? 'עדיין אין תלמידות. מוסיפים אותן ב<b>ניהול ← תלמידות</b>.' : 'עדיין אין מורות. מוסיפים אותן ב<b>ניהול ← מורות</b>.'}</div>`;
    document.getElementById('app').innerHTML = html;
    return;
  }

  const mine = all.filter(s => mode === 'student' ? s.studentIds.split(',').includes(key) : s.teacherEmail === key);

  // שורת סיכום
  if (mode === 'student') {
    const s = stu[key], n = mine.filter(slotActiveToday).length, gap = (s.approvedHours || 0) - n;
    html += `<div class="tt-sum"><span class="name">${h(s.name)}</span><span class="muted">כיתה ${h(s.className)}</span>
      <span>סל שבועי: <b>${s.approvedHours || 0}</b> · שובצו: <b>${n}</b></span>
      ${!s.approvedHours ? '' : gap > 0 ? `<span class="badge b-warn">חסרות ${gap === 1 ? 'שעה אחת' : gap + ' שעות'}</span>` : gap < 0 ? `<span class="badge b-warn">שובצו ${-gap === 1 ? 'שעה אחת' : -gap + ' שעות'} יותר מהסל</span>` : '<span class="badge b-ok">תואם לסל ✓</span>'}</div>`;
  } else {
    html += `<div class="tt-sum"><span class="name">${h(tName[key] || key)}</span><span>${(n => n === 1 ? 'שיעור אחד' : n + ' שיעורים')(mine.filter(slotActiveToday).length)} בשבוע</span></div>`;
  }

  // בניית התאים
  const ps = periods(), days = B.days;
  const cell = {}, other = {};
  mine.forEach(s => {
    const p = periodOf(s.time, s.day);
    if (p < 0) (other[s.day] = other[s.day] || []).push(s);
    else (cell[s.day + '|' + p] = cell[s.day + '|' + p] || []).push(s);
  });
  Object.values(other).forEach(l => l.sort((a, b) => padT(a.time) < padT(b.time) ? -1 : 1));

  const slotHtml = s => {
    const [bg, bd] = subjColor(s.subject, subjects);
    const ids = s.studentIds.split(',');
    const conf = conflictsOf(s, all);
    const who = mode === 'student'
      ? h(tName[s.teacherEmail] || s.teacherEmail) + (ids.length > 1 ? ` · קבוצתי (+${ids.length - 1})` : '')
      : h(ids.map(id => stu[id] ? stu[id].name : '?').join(', '));
    const tags = (s.validFrom > S.today ? `<div class="small">החל מ${fmtFull(s.validFrom)}</div>` : '') +
      (s.validTo ? `<div class="small">עד ${fmtFull(s.validTo)}</div>` : '') +
      (periodOf(s.time, s.day) < 0 || (s.day === boardingDay() && periods()[periodOf(s.time, s.day)].bStart) ? `<div class="small">${h(shortT(s.time))}</div>` : '') +
      (conf.length ? `<div class="warn-t">⚠ ${conf.some(o => o.teacherEmail === s.teacherEmail) ? 'למורה יש שיעור נוסף בשעה הזו' : 'לתלמידה יש שיעור נוסף בשעה הזו'}</div>` : '');
    const inner = `<b>${h(s.subject)}</b><span class="w">${who}</span>${tags}`;
    const cls = `tt-slot${s.validFrom > S.today ? ' future' : ''}`, st = `background:${bg};border-inline-start-color:${bd}`;
    return edit ? `<button class="${cls}" style="${st}" data-a="slot-edit" data-v="${h(s.id)}" title="עריכה">${inner}</button>`
      : `<div class="${cls}" style="${st}">${inner}</div>`;
  };
  const addBtn = (day, p, text) => edit ? `<button class="tt-add" data-a="tt-add" data-day="${h(day)}" data-time="${h(periodsFor(day)[p].start)}" title="הוספת שיעור">${text || '+'}</button>` : '';

  if (!isNarrow()) {
    html += `<div class="tt-wrap"><table class="tt"><thead><tr><th class="p"></th>${days.map(x => `<th>${h(x)}${x === boardingDay() ? '<div class="small muted" style="font-weight:400">יום פנימיה</div>' : ''}</th>`).join('')}</tr></thead><tbody>`;
    ps.forEach((p, i) => {
      html += `<tr><th class="p">שעה ${i + 1}<small>${periodRange(i)}</small></th>` + days.map(day => {
        const l = cell[day + '|' + i] || [];
        return `<td${l.length > 1 ? ' class="conf"' : ''}>${l.map(slotHtml).join('') || addBtn(day, i)}</td>`;
      }).join('') + '</tr>';
    });
    if (Object.keys(other).length) {
      html += `<tr><th class="p">שעה אחרת</th>${days.map(day => `<td>${(other[day] || []).map(slotHtml).join('')}</td>`).join('')}</tr>`;
    }
    html += '</tbody></table></div>';
  } else {
    // בטלפון: יום אחד בכל פעם
    const todayName = days[weekday(S.today)];
    if (!days.includes(Q.day)) Q.day = days.includes(todayName) ? todayName : days[0];
    const count = day => mine.filter(s => s.day === day).length;
    html += `<div class="chips no-print" style="margin-bottom:8px">${days.map(x => `<button class="chip${x === Q.day ? ' on' : ''}" data-a="tt-day" data-v="${h(x)}">${h(x)}${count(x) ? ` (${count(x)})` : ''}</button>`).join('')}</div>`;
    html += `<div class="card tt-day">` + ps.map((p, i) => {
      const l = cell[Q.day + '|' + i] || [];
      return `<div class="tt-row"><div class="when">שעה ${i + 1}<small>${periodRange(i, Q.day)}</small></div><div class="grow">${l.map(slotHtml).join('') || addBtn(Q.day, i, '+ הוספת שיעור') || '<span class="muted small">—</span>'}</div></div>`;
    }).join('') + (other[Q.day] || []).map(s => `<div class="tt-row"><div class="when">${h(shortT(s.time))}</div><div class="grow">${slotHtml(s)}</div></div>`).join('') + '</div>';
  }
  if (boardingDay() && periods().some(p => p.bStart)) html += `<div class="tt-legend">ביום ${h(boardingDay())} (יום פנימיה) ${periods().map((p, i) => p.bStart ? `שעה ${i + 1} היא ${periodRange(i, boardingDay())}` : '').filter(Boolean).join(', ')}.</div>`;
  if (edit) html += `<div class="tt-legend no-print">לחיצה על משבצת ריקה מוסיפה שיעור, ולחיצה על שיעור פותחת אותו לעריכה. את שעות הצלצולים אפשר לשנות ב<b>ניהול ← עוד ← הגדרות</b>.</div>`;
  document.getElementById('app').innerHTML = html;
}

function slotActiveToday(s) { return (!s.validFrom || s.validFrom <= S.today) && (!s.validTo || s.validTo >= S.today); }

  if (!['students', 'users', 'holidays', 'history', 'settings'].includes(A.sub)) A.sub = 'students';
  const subs = [['students', 'תלמידות'], ['users', 'מורות'], ['holidays', 'חופשות']], more = [['history', 'יומן שינויים'], ['settings', 'הגדרות']];
  const moreOpen = A.more || more.some(x => x[0] === A.sub);
  const chip = ([k, l]) => `<button class="chip${A.sub === k ? ' on' : ''}" data-a="admin-sub" data-v="${k}">${l}</button>`;
  let html = `<div class="subtabs">${subs.map(chip).join('')}<button class="chip" data-a="admin-more">${moreOpen ? 'פחות ▴' : 'עוד ▾'}</button>${moreOpen ? more.map(chip).join('') : ''}</div>`;

      return `<div class="card${s.active === 'לא' ? ' dim' : ''}"><div class="list-item"><div class="grow">
        <b>${h(s.name)}</b> <span class="muted">· ${h(s.className)}</span>${s.active === 'לא' ? ' <span class="tag">לא פעילה</span>' : ''}
        <div class="small" style="margin-top:4px">סל שבועי: <b>${s.approvedHours}</b> · משובצות: <b>${n}</b> ${mis ? '<span class="badge b-warn">יש פער בין הסל לשיבוץ</span>' : ''}</div>
        ${mySlots.length ? `<div class="small muted" style="margin-top:4px">${mySlots.sort((a, b) => S.boot.days.indexOf(a.day) - S.boot.days.indexOf(b.day) || (padT(a.time) < padT(b.time) ? -1 : 1)).map(x => `${h(x.subject)} – ${h(tName[x.teacherEmail] || x.teacherEmail)} (${h(whenText(x.day, x.time))})`).join('<br>')}</div>` : ''}
        ${s.notes ? `<div class="small" style="margin-top:4px">📝 ${h(s.notes)}</div>` : ''}
      </div><div class="row" style="flex-direction:column;align-items:stretch;gap:6px">${s.active !== 'לא' ? `<button class="btn sm pri" data-a="tt-open" data-v="${h(s.id)}">מערכת שעות</button>` : ''}<button class="btn sm" data-a="student-edit" data-v="${h(s.id)}">עריכה</button></div></div></div>`;
    }).join('') : '<div class="empty">עדיין אין תלמידות. אפשר להתחיל בהוספת תלמידה.</div>';
  }

  if (A.sub === 'users') {
