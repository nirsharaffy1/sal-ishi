<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<script>window.API_URL = "https://script.google.com/macros/s/AKfycbwFBaM8Je1NXoedf5-4sgrWT0wSlKnmJ7oSGUUkYWWsoSh0npl18_XWmGrQKZLycv4BOA/exec";</script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="סל אישי">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מעקב שעות סל אישי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6f8; --card: #fff; --ink: #1f2937; --muted: #6b7280; --line: #e5e7eb;
    --pri: #0f766e; --pri-ink: #fff; --pri-weak: #e6f4f2;
    --ok: #15803d; --ok-bg: #dcfce7; --warn: #b45309; --warn-bg: #fef3c7;
    --bad: #b91c1c; --bad-bg: #fee2e2; --info: #1d4ed8; --info-bg: #dbeafe;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Heebo, Arial, sans-serif; font-size: 16px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .top { background: var(--pri); color: var(--pri-ink); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .brand { font-weight: 700; font-size: 18px; }
  .userbox { font-size: 14px; display: flex; gap: 10px; align-items: center; }
  .userbox button { background: transparent; border: 1px solid rgba(255,255,255,.6); color: #fff; border-radius: 8px; padding: 3px 10px; cursor: pointer; font-size: 13px; }
  nav.tabs { display: flex; gap: 4px; background: #fff; border-bottom: 1px solid var(--line); padding: 0 8px; overflow-x: auto; position: sticky; top: 0; z-index: 5; }
  nav.tabs button { border: 0; background: none; padding: 12px 14px; cursor: pointer; white-space: nowrap; color: var(--muted); border-bottom: 3px solid transparent; font-weight: 500; }
  nav.tabs button.on { color: var(--pri); border-bottom-color: var(--pri); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 20px; margin: 4px 0 12px; }
  h3 { font-size: 17px; margin: 20px 0 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 500; }
  .btn:hover { border-color: #cbd5e1; }
  .btn.pri { background: var(--pri); color: #fff; border-color: var(--pri); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--pri); }
  .btn.danger { color: var(--bad); }
  .btn.sm { padding: 5px 10px; font-size: 14px; }
  .btn:disabled { opacity: .5; cursor: default; }
  label.f { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=email], input[type=number], input[type=date], input[type=time], select, textarea {
    width: 100%; border: 1px solid #d1d5db; border-radius: 10px; padding: 9px 10px; background: #fff; }
  textarea { min-height: 60px; resize: vertical; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .b-ok { background: var(--ok-bg); color: var(--ok); }
  .b-warn { background: var(--warn-bg); color: var(--warn); }
  .b-bad { background: var(--bad-bg); color: var(--bad); }
  .b-info { background: var(--info-bg); color: var(--info); }
  .b-missing { background: var(--bad-bg); color: var(--bad); }
  .b-pending { background: #f3f4f6; color: #374151; }
  .b-future { background: #f3f4f6; color: var(--muted); }
  .tag { display: inline-block; font-size: 12px; background: #f3f4f6; color: #374151; border-radius: 6px; padding: 1px 7px; margin-inline-start: 6px; font-weight: 400; }

  /* שיעור */
  .lesson { border-inline-start: 5px solid var(--line); }
  .lesson.s-ok { border-inline-start-color: var(--ok); }
  .lesson.s-warn { border-inline-start-color: #f59e0b; }
  .lesson.s-bad, .lesson.s-missing { border-inline-start-color: var(--bad); }
  .lesson.s-info { border-inline-start-color: var(--info); }
  .lesson-head { display: flex; gap: 12px; align-items: flex-start; }
  .lesson-time { font-weight: 700; font-size: 17px; min-width: 52px; }
  .lesson-subj { font-weight: 700; }
  .lesson-studs { color: #374151; font-size: 15px; margin-top: 2px; }
  .lesson-sum { font-size: 14px; color: var(--muted); margin-top: 8px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .choice { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 14px 8px; cursor: pointer; font-weight: 500; font-size: 15px; }
  .choice.on.c-ok { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
  .choice.on.c-warn { border-color: #f59e0b; background: var(--warn-bg); color: var(--warn); }
  .choice.on.c-bad { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
  .choice.on.c-info { border-color: var(--info); background: var(--info-bg); color: var(--info); }
  .stud-row { border-top: 1px solid var(--line); padding: 10px 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 7px 14px; cursor: pointer; }
  .seg button.on.p { background: var(--ok-bg); color: var(--ok); font-weight: 700; }
  .seg button.on.a { background: var(--bad-bg); color: var(--bad); font-weight: 700; }
  .form-actions { display: flex; gap: 8px; margin-top: 14px; }
  .form-actions .btn.pri { flex: 1; padding: 12px; font-size: 17px; }
  .alert { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; }
  .alert.bad { background: var(--bad-bg); color: #7f1d1d; }
  .alert.warn { background: var(--warn-bg); color: #78350f; }
  .datebar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .datebar .label { flex: 1; text-align: center; font-weight: 700; font-size: 18px; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }

  /* לוח בקרה */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
  .chip.on { background: var(--pri); color: #fff; border-color: var(--pri); }
  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 14px 0; }
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
  .kpi .v { font-size: 26px; font-weight: 700; }
  .kpi .l { font-size: 13px; color: var(--muted); }
  .kpi.bad .v { color: var(--bad); } .kpi.ok .v { color: var(--ok); } .kpi.info .v { color: var(--info); } .kpi.warn .v { color: var(--warn); }
  .tbl-wrap { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 8px 10px; text-align: start; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { background: #f9fafb; font-weight: 500; color: #374151; position: sticky; top: 0; }
  td.num, th.num { text-align: center; }
  tr.click { cursor: pointer; } tr.click:hover td { background: #f9fafb; }
  tr.low td, tr.low td.first { background: #fff1f2; }
  .low-link { color: inherit; font-weight: 500; }
  .who { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .hist.changed { border-inline-start: 4px solid #f59e0b; }
  .hist-line { font-size: 14px; margin-top: 6px; }
  .hist-line span { font-weight: 500; }
  .hist-line.before { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(0,0,0,.25); }
  .hist-line.before span { text-decoration: none; display: inline-block; }
  td.first, th.first { position: sticky; right: 0; background: inherit; }
  tbody td.first { background: #fff; font-weight: 500; }
  .pct { display: flex; align-items: center; gap: 6px; min-width: 110px; }
  .pct .bar { flex: 1; height: 8px; background: #eef0f3; border-radius: 4px; overflow: hidden; }
  .pct .bar i { display: block; height: 100%; }
  .bars .b { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 14px; }
  .bars .b .t { width: 45%; }
  .bars .b .track { flex: 1; background: #eef0f3; border-radius: 4px; height: 10px; overflow: hidden; }
  .bars .b .track i { display: block; height: 100%; background: var(--pri); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  details summary { cursor: pointer; font-weight: 500; padding: 6px 0; }

  /* מערכת שעות */
  .daycol h4 { margin: 16px 0 8px; font-size: 16px; color: var(--pri); }
  .slot { display: flex; gap: 12px; align-items: center; }

  /* ניהול */
  .subtabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .list-item { display: flex; gap: 10px; align-items: center; }
  .dim { opacity: .55; }
  .checks { max-height: 220px; overflow-y: auto; border: 1px solid #d1d5db; border-radius: 10px; padding: 6px 10px; }
  .checks label { display: flex; gap: 8px; align-items: center; padding: 5px 0; }

  /* חלון קופץ */
  .modal { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: flex-start; justify-content: center; padding: 30px 12px; z-index: 50; overflow-y: auto; }
  .modal.hidden { display: none; }
  .modal-box { background: #fff; border-radius: 16px; width: 100%; max-width: 520px; padding: 18px; }
  .modal-box h3 { margin-top: 0; }

  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 18px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--bad); }
  #busy { position: fixed; top: 0; right: 0; left: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--pri), transparent); background-size: 200% 100%; animation: slide 1s linear infinite; display: none; z-index: 70; }
  #busy.on { display: block; }
  @keyframes slide { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .login { max-width: 380px; margin: 40px auto; }
  #install-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; background: #fff; border-top: 3px solid var(--pri);
    box-shadow: 0 -4px 16px rgba(0,0,0,.12); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: center; }
  #install-bar .small { color: var(--muted); margin-top: 2px; }
  .ios-share { display: inline-block; border: 1px solid #94a3b8; border-radius: 4px; padding: 0 4px; font-size: 12px; }
  @media (display-mode: standalone) { .top { padding-top: calc(12px + env(safe-area-inset-top)); } }

  .report-head h2 { margin-bottom: 2px; }
  .report-kpis { grid-template-columns: repeat(auto-fit, minmax(95px, 1fr)); }

  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    .top, nav.tabs, .no-print, #dev-panel, #dev-notice, #toast, #busy, .modal { display: none !important; }
    html, body { background: #fff; font-size: 12px; }
    main { max-width: none; padding: 0; }
    .card, .kpi { border-color: #bbb; break-inside: avoid; }
    .report-kpis { grid-template-columns: repeat(7, 1fr); margin: 8px 0; }
    .kpi { padding: 4px 8px; } .kpi .v { font-size: 16px; }
    .tbl-wrap { overflow: visible; border: 0; border-radius: 0; }
    table { font-size: 10.5px; }
    th, td { white-space: normal !important; padding: 3px 5px; border: 1px solid #bbb; }
    th { position: static; background: #eee !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    thead { display: table-header-group; }
    tr { break-inside: avoid; }
    h3 { break-after: avoid; margin: 12px 0 6px; }
  }

  @media (max-width: 640px) {
    main { padding: 12px; }
    .two { grid-template-columns: 1fr; }
    .kpi .v { font-size: 22px; }
    .brand { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="busy"></div>
<header class="top">
  <div class="brand">מעקב שעות סל אישי</div>
  <div class="userbox" id="userbox"></div>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="app"><div class="empty">טוען…</div></main>
<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
<div id="toast"></div>

<script>
/* ============================== קבועים ומצב ============================== */
const HELD = 'התקיים', NOT_HELD = 'לא התקיים', POSTPONED = 'נדחה';
const DAY_LETTERS = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
const ROLE_COORD = 'רכזת', ROLE_TEACHER = 'מורה', ROLE_MANAGER = 'הנהלה';

const S = {
  boot: null, tab: null, today: null,
  day: { date: null, teacher: '', data: null }, forms: {},
  dash: { preset: 'week', from: '', to: '', data: null, f: { student: '', teacher: '', subject: '', className: '' } },
  rep: { preset: 'month', from: '', to: '', data: null, f: { student: '', teacher: '', subject: '', className: '' }, view: 'students', student: '' },
  sched: { date: '', data: null, f: { student: '', teacher: '', className: '', day: '' } },
  admin: { sub: 'students', data: null, showEnded: false },
  login: { step: 'email', email: '' },
};

/* ============================== תקשורת עם השרת ============================== */
let busyCount = 0;
function setBusy(d) { busyCount += d; document.getElementById('busy').classList.toggle('on', busyCount > 0); }

function getToken() { try { return localStorage.getItem('sal_token') || ''; } catch (e) { return S._token || ''; } }
function setToken(t) { S._token = t; try { t ? localStorage.setItem('sal_token', t) : localStorage.removeItem('sal_token'); } catch (e) {} }

/**
 * שליחת פעולה לשרת. בתוך Google (Apps Script) – דרך google.script.run.
 * באפליקציה המותקנת (PWA) מוגדר window.API_URL – ואז דרך fetch לכתובת הסקריפט.
 */
function transport(action, payload) {
  const args = [getToken(), action, JSON.stringify(payload || {})];
  if (window.API_URL) {
    return fetch(window.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: args[0], action: args[1], payload: args[2] }),
    }).then(r => { if (!r.ok) throw new Error('השרת לא זמין כרגע (' + r.status + ')'); return r.text(); });
  }
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).api(...args);
  });
}

function call(action, payload) {
  setBusy(1);
  return transport(action, payload)
    .catch(e => {
      if (navigator.onLine === false) throw new Error('אין חיבור לאינטרנט. נסי שוב כשתהיה קליטה.');
      if (e instanceof TypeError) throw new Error('לא הצלחנו להתחבר לשרת. נסי שוב בעוד רגע.');
      throw new Error(e && e.message ? e.message : 'בעיית תקשורת. נסי שוב.');
    })
    .then(txt => {
      const r = JSON.parse(txt);
      if (r.ok) return r.data;
      const err = new Error(r.error || 'שגיאה');
      err.auth = !!r.auth;
      if (r.auth) showLogin();
      throw err;
    })
    .finally(() => setBusy(-1));
}

/* ============================== עזרים ============================== */
function h(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function parseD(d) { const [y, m, dd] = d.split('-').map(Number); return new Date(Date.UTC(y, m - 1, dd)); }
function addDays(d, n) { const x = parseD(d); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
function weekday(d) { return parseD(d).getUTCDay(); }
function fmtDate(d, withDay = true) { if (!d) return ''; const [, m, dd] = d.split('-'); return (withDay ? 'יום ' + DAY_LETTERS[weekday(d)] + ' ' : '') + (+dd) + '.' + (+m); }
function fmtStamp(s) { const [d, t] = String(s).split(' '); return d && d.length === 10 ? fmtFull(d) + (t ? ' ' + t : '') : s; }
function fmtFull(d) { if (!d) return ''; const [y, m, dd] = d.split('-'); return (+dd) + '.' + (+m) + '.' + y; }
function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(t._h); t._h = setTimeout(() => { t.className = ''; }, isErr ? 4500 : 2200);
}
function fail(e) { if (!e.auth) toast(e.message || 'שגיאה', true); }
function isCoord() { return S.boot && S.boot.user.role === ROLE_COORD; }
function canView() { return S.boot && (S.boot.user.role === ROLE_COORD || S.boot.user.role === ROLE_MANAGER); }
function opt(v, label, sel) { return `<option value="${h(v)}"${String(v) === String(sel) ? ' selected' : ''}>${h(label)}</option>`; }
function uniq(arr) { return [...new Set(arr.filter(Boolean))].sort((a, b) => a.localeCompare(b, 'he')); }
function threshold() { return (S.boot && S.boot.threshold) || 75; }
function pctColor(p) { return p >= Math.max(90, threshold()) ? 'var(--ok)' : p >= threshold() ? '#f59e0b' : 'var(--bad)'; }
function isLow(r) { return r.due >= 3 && r.present / r.due * 100 < threshold(); }
function pctCell(num, den) {
  if (!den) return '<span class="muted">—</span>';
  const p = Math.min(100, Math.round(num / den * 100));
  return `<div class="pct"><div class="bar"><i style="width:${p}%;background:${pctColor(p)}"></i></div><b style="color:${pctColor(p)}">${p}%</b></div>`;
}
function studentsText(list) { return list.map(s => s.name + (s.className ? ` (${s.className})` : '')).join(', '); }

/* ============================== כניסה ============================== */
function showLogin() {
  document.getElementById('tabs').innerHTML = '';
  document.getElementById('userbox').innerHTML = '';
  const L = S.login;
  document.getElementById('app').innerHTML = `
    <div class="card login">
      <h2>כניסה למערכת</h2>
      ${L.step === 'email' ? `
        <p class="muted">יש להזין את כתובת המייל הרשומה במערכת. יישלח אלייך קוד כניסה.</p>
        <label class="f">כתובת מייל</label>
        <input type="email" id="lg-email" value="${h(L.email)}" dir="ltr" autocomplete="email">
        <div class="form-actions"><button class="btn pri" data-a="login-send">שליחת קוד</button></div>
      ` : `
        <p class="muted">נשלח קוד בן 6 ספרות אל <b dir="ltr">${h(L.email)}</b></p>
        <label class="f">קוד כניסה</label>
        <input type="text" id="lg-code" inputmode="numeric" maxlength="6" dir="ltr" autocomplete="one-time-code">
        <div class="form-actions"><button class="btn pri" data-a="login-verify">כניסה</button></div>
        <button class="btn ghost" data-a="login-back">שינוי כתובת / שליחה מחדש</button>
      `}
    </div>`;
  const el = document.getElementById(L.step === 'email' ? 'lg-email' : 'lg-code');
  if (el) el.focus();
}

/** נועל את כפתור הכניסה בזמן שהבקשה בדרך, כדי שלחיצה כפולה לא תשלח פעמיים. */
let loginBusy = false;
function lockLogin(action, text) {
  loginBusy = true;
  const b = document.querySelector(`[data-a="${action}"]`);
  if (b) { b.disabled = true; b.dataset.label = b.textContent; b.textContent = text; }
}
function unlockLogin(action) {
  loginBusy = false;
  const b = document.querySelector(`[data-a="${action}"]`);
  if (b) { b.disabled = false; if (b.dataset.label) b.textContent = b.dataset.label; }
}

async function loginSend() {
  if (loginBusy) return;
  const email = document.getElementById('lg-email').value.trim();
  if (!email) return toast('יש להזין מייל', true);
  S.login.email = email;
  lockLogin('login-send', 'שולחת קוד…');
  try { await call('sendCode', { email }); loginBusy = false; S.login.step = 'code'; showLogin(); }
  catch (e) { unlockLogin('login-send'); fail(e); }
}
async function loginVerify() {
  if (loginBusy) return;
  const code = document.getElementById('lg-code').value.trim();
  if (!/^\d{6}$/.test(code)) return toast('יש להזין את 6 הספרות מהמייל', true);
  lockLogin('login-verify', 'בודקת…');
  try {
    const r = await call('verify', { email: S.login.email, code });
    setToken(r.token);
    S.login = { step: 'email', email: '' };
    loginBusy = false;
    init();
  } catch (e) { unlockLogin('login-verify'); fail(e); }
}
async function logout() {
  try { await call('logout'); } catch (e) {}
  setToken('');
  location.reload();
}

/* ============================== התקנה כאפליקציה (רק בגרסה המותקנת) ============================== */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; showInstall(); });
window.addEventListener('appinstalled', () => { installEvt = null; hideInstall(); });

function isStandalone() { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function installDismissed() { try { return Number(localStorage.getItem('sal_install_dismissed') || 0) > Date.now(); } catch (e) { return false; } }

function showInstall() {
  if (!window.API_URL || isStandalone() || installDismissed()) return;
  if (!installEvt && !isIOS()) return;
  let bar = document.getElementById('install-bar');
  if (!bar) { bar = document.createElement('div'); bar.id = 'install-bar'; document.body.appendChild(bar); }
  bar.innerHTML = installEvt
    ? `<div class="grow"><b>📲 התקנת האפליקציה בטלפון</b><div class="small">כך תיכנסי בלחיצה אחת ממסך הבית</div></div>
       <button class="btn pri" data-a="install-now">התקנה</button><button class="btn ghost" data-a="install-later">לא עכשיו</button>`
    : `<div class="grow"><b>📲 התקנת האפליקציה באייפון</b>
         <div class="small">בספארי: לוחצים על כפתור השיתוף <span class="ios-share">⬆︎</span> בתחתית המסך ← <b>"הוספה למסך הבית"</b> ← "הוסף". אחר כך נכנסים מהאייקון שנוצר.</div></div>
       <button class="btn ghost" data-a="install-later">סגירה</button>`;
}
function hideInstall() { const b = document.getElementById('install-bar'); if (b) b.remove(); }
async function installNow() {
  if (!installEvt) return;
  installEvt.prompt();
  const choice = await installEvt.userChoice.catch(() => null);
  installEvt = null;
  hideInstall();
  if (choice && choice.outcome === 'accepted') toast('האפליקציה הותקנה ✓');
}
function installLater() {
  try { localStorage.setItem('sal_install_dismissed', String(Date.now() + 7 * 24 * 3600 * 1000)); } catch (e) {}
  hideInstall();
}

/* ============================== מבנה כללי ============================== */
function tabsFor() {
  const u = S.boot.user, t = [];
  if (u.role === ROLE_TEACHER || u.role === ROLE_COORD || S.boot.hasLessons) t.push(['day', u.role === ROLE_COORD ? 'דיווח שיעורים' : 'השיעורים שלי']);
  if (canView()) t.push(['dash', 'לוח בקרה'], ['rep', 'דוחות']);
  t.push(['sched', canView() ? 'מערכת שעות' : 'המערכת שלי']);
  if (isCoord()) t.push(['admin', 'ניהול']);
  return t;
}

async function init() {
  try {
    S.boot = await call('bootstrap', { appUrl: window.API_URL ? location.href : '' });
    S.today = S.boot.today;
    S.day.date = S.today;
    S.day.teacher = S.boot.user.email;
    document.getElementById('userbox').innerHTML = `<span>${h(S.boot.user.name)} · ${h(S.boot.user.role)}</span><button data-a="logout">יציאה</button>`;
    const tabs = tabsFor();
    let saved = ''; try { saved = localStorage.getItem('sal_tab') || ''; } catch (e) {}
    const start = tabs.some(t => t[0] === saved) ? saved : (canView() && !S.boot.hasLessons ? 'dash' : tabs[0][0]);
    go(start);

function go(tab) {
  S.tab = tab;

  document.getElementById('tabs').innerHTML = tabsFor().map(([k, l]) => `<button class="${k === tab ? 'on' : ''}" data-a="tab" data-v="${k}">${l}</button>`).join('');

/* ============================== השיעורים שלי / דיווח ============================== */
async function loadDay() {

    S.day.data = await call('myDay', { date: S.day.date, teacherEmail: S.day.teacher });
    S.forms = {};

function allDayLessons() { const d = S.day.data; return d ? d.lessons.concat(d.missing) : []; }
function findLesson(id) { return allDayLessons().find(l => l.id === id); }

function renderDay() {
  const d = S.day.data, date = S.day.date;
  const isToday = date === S.today;
  let html = '';
  if (isCoord()) {
    html += `<div class="card"><label class="f" style="margin-top:0">דיווח עבור</label>
      <select data-a="day-teacher">${S.boot.teachers.filter(t => t.role !== ROLE_MANAGER).map(t => opt(t.email, t.name + (t.email === S.boot.user.email ? ' (אני)' : ''), S.day.teacher)).join('')}</select></div>`;
  }

  }

      <button class="btn sm" data-a="day-move" data-v="-1">→ הקודם</button>
      <div class="label">${isToday ? 'היום, ' : ''}${fmtDate(date)}</div>
      <button class="btn sm" data-a="day-move" data-v="1">הבא ←</button>
    </div>
    <div class="row" style="justify-content:center;margin-bottom:12px">
      <input type="date" value="${date}" data-a="day-pick" style="max-width:180px">
      ${isToday ? '' : '<button class="btn sm" data-a="day-today">חזרה להיום</button>'}
    </div>`;
  html += d.lessons.length ? d.lessons.map(l => lessonCard(l, false)).join('')

  if (d.missing.length) {
    html += `<h3>ממתינים לדיווח מימים קודמים</h3>` + d.missing.map(l => lessonCard(l, true)).join('');
  }

}

function statusInfo(l) {
  if (!l.status) {
    if (l.date < S.today) return { cls: 'missing', text: 'טרם דווח' };
    if (l.date === S.today) return { cls: 'pending', text: 'ממתין לדיווח' };
    return { cls: 'future', text: 'מתוכנן' };
  }
  if (l.status === HELD) {
    const n = l.students.length, abs = l.students.filter(s => s.present === false).length;
    if (!abs) return { cls: 'ok', text: n > 1 ? 'התקיים · כולן נכחו' : 'התקיים · נכחה' };
    if (abs === n) return { cls: 'warn', text: n > 1 ? 'התקיים · אף אחת לא נכחה' : 'התקיים · לא נכחה' };
    return { cls: 'warn', text: `התקיים · ${n - abs} מתוך ${n} נכחו` };
  }
  if (l.status === NOT_HELD) return { cls: 'bad', text: 'לא התקיים' };
  return { cls: 'info', text: l.makeupDate ? 'נדחה ל' + fmtDate(l.makeupDate) : 'נדחה' };
}

function lessonSummary(l) {
  if (!l.status) return '';
  const parts = [];
  if (l.reason) parts.push('סיבה: ' + l.reason + (l.reasonText ? ' – ' + l.reasonText : ''));
  l.students.filter(s => s.present === false).forEach(s => {
    parts.push((l.students.length > 1 ? s.name + ' נעדרה: ' : 'סיבת היעדרות: ') + (s.reason || '') + (s.reasonText ? ' – ' + s.reasonText : ''));
  });
  if (l.topic) parts.push('נלמד: ' + l.topic);
  if (l.note) parts.push('הערה: ' + l.note);
  const who = l.reportedAt ? `<div class="who">דווח ${l.reportedByOther ? 'ע״י ' + h(l.reportedByName) + ' ' : ''}ב־${h(fmtStamp(l.reportedAt))}</div>` : '';
  return (parts.length ? `<div class="lesson-sum">${parts.map(h).join('<br>')}</div>` : '') + who;
}

function lessonCard(l, showDate) {
  const st = statusInfo(l);
  const f = S.forms[l.id];
  const future = l.date > S.today;
  return `<div class="card lesson s-${st.cls}" id="L-${h(l.id)}">
    <div class="lesson-head">
      <div class="lesson-time">${h(l.time)}</div>
      <div class="grow">
        <div class="lesson-subj">${h(l.subject)}${showDate ? `<span class="tag">${fmtDate(l.date)}</span>` : ''}${l.kind === 'השלמה' ? `<span class="tag">השלמה${l.makeupOfDate ? ' לשיעור מ' + fmtDate(l.makeupOfDate) : ''}</span>` : ''}${l.students.length > 1 ? '<span class="tag">קבוצתי</span>' : ''}</div>
        <div class="lesson-studs">${h(studentsText(l.students))}</div>
      </div>
      <span class="badge b-${st.cls}">${h(st.text)}</span>
    </div>
    ${f && f.open ? renderForm(l) : lessonSummary(l) + (future ? '' : `<div class="row" style="margin-top:10px"><button class="btn ${l.status ? 'sm' : 'pri'}" data-a="open-form" data-id="${h(l.id)}">${l.status ? 'עריכת דיווח' : 'דיווח על השיעור'}</button></div>`)}
  </div>`;
}

function formFor(l) {
  if (!S.forms[l.id]) {
    const att = {};
    l.students.forEach(s => { att[s.id] = { present: s.present !== false, reason: s.reason || '', reasonText: s.reasonText || '' }; });
    S.forms[l.id] = { open: false, status: l.status, reason: l.reason, reasonText: l.reasonText, topic: l.topic, note: l.note,
      makeupDate: l.makeupDate || '', makeupTime: l.makeupTime || l.time, att };
  }
  return S.forms[l.id];
}

function reasonSelect(list, value, attrs) {
  return `<select ${attrs}><option value="">בחרי סיבה…</option>${list.map(r => opt(r, r, value)).join('')}</select>`;
}

function renderForm(l) {
  const f = formFor(l), id = h(l.id);
  const single = l.students.length === 1, sid = l.students[0].id;
  const B = S.boot;
  let choice = '';
  if (f.status === HELD) choice = single ? (f.att[sid].present ? 'hp' : 'ha') : 'h';
  else if (f.status === NOT_HELD) choice = 'n';
  else if (f.status === POSTPONED) choice = 'p';
  const opts = single
    ? [['hp', 'התקיים – התלמידה נכחה', 'ok'], ['ha', 'התקיים – התלמידה לא נכחה', 'warn'], ['n', 'השיעור לא התקיים', 'bad'], ['p', 'נדחה / הועבר למועד אחר', 'info']]
    : [['h', 'התקיים', 'ok'], ['n', 'השיעור לא התקיים', 'bad'], ['p', 'נדחה / הועבר', 'info']];
  let html = `<div class="choices"${single ? '' : ' style="grid-template-columns:1fr 1fr 1fr"'}>` +
    opts.map(([v, label, c]) => `<button class="choice c-${c}${choice === v ? ' on' : ''}" data-a="choose" data-id="${id}" data-v="${v}">${label}</button>`).join('') + '</div>';

  if (f.status === HELD) {
    if (single) {
      const a = f.att[sid];
      if (!a.present) html += absenceFields(id, sid, a, B);
    } else {
      html += '<div style="margin-top:12px">' + l.students.map(s => {
        const a = f.att[s.id];
        return `<div class="stud-row"><div class="row"><div class="grow">${h(s.name)} <span class="muted small">${h(s.className)}</span></div>
          <div class="seg"><button class="p${a.present ? ' on' : ''}" data-a="att" data-id="${id}" data-sid="${h(s.id)}" data-v="1">נכחה</button><button class="a${!a.present ? ' on' : ''}" data-a="att" data-id="${id}" data-sid="${h(s.id)}" data-v="0">נעדרה</button></div></div>
          ${a.present ? '' : absenceFields(id, s.id, a, B)}</div>`;
      }).join('') + '</div>';
    }
    html += `<label class="f">מה נלמד בשיעור</label><input type="text" data-f="topic" data-id="${id}" value="${h(f.topic)}" placeholder="לדוגמה: שברים פשוטים">`;
  }
  if (f.status === NOT_HELD || f.status === POSTPONED) {
    html += `<label class="f">${f.status === NOT_HELD ? 'למה השיעור לא התקיים?' : 'סיבת הדחייה'}</label>` + reasonSelect(B.lessonReasons, f.reason, `data-f="reason" data-id="${id}"`);
    if (f.reason === B.otherReason) html += `<input type="text" style="margin-top:6px" data-f="reasonText" data-id="${id}" value="${h(f.reasonText)}" placeholder="פירוט הסיבה">`;
  }
  if (f.status === POSTPONED) {
    html += `<label class="f">המועד החדש (אם כבר נקבע)</label>
      <div class="row"><input type="date" class="grow" data-f="makeupDate" data-id="${id}" value="${h(f.makeupDate)}" min="${h(l.date)}" style="width:auto">
      <input type="time" data-f="makeupTime" data-id="${id}" value="${h(f.makeupTime)}" style="width:120px"></div>
      <div class="muted small" style="margin-top:4px">שיעור ההשלמה יופיע אצלך ביום שנבחר.</div>`;
  }
  if (f.status) html += `<label class="f">הערה (לא חובה)</label><input type="text" data-f="note" data-id="${id}" value="${h(f.note)}">`;
  html += `<div class="form-actions"><button class="btn pri" data-a="save-report" data-id="${id}"${f.status ? '' : ' disabled'}>שמירה</button><button class="btn" data-a="close-form" data-id="${id}">ביטול</button></div>`;
  return html;
}

function absenceFields(id, sid, a, B) {
  return `<label class="f">סיבת ההיעדרות</label>` + reasonSelect(B.absenceReasons, a.reason, `data-f="attReason" data-id="${id}" data-sid="${h(sid)}"`) +
    (a.reason === B.otherReason ? `<input type="text" style="margin-top:6px" data-f="attReasonText" data-id="${id}" data-sid="${h(sid)}" value="${h(a.reasonText)}" placeholder="פירוט">` : '');
}

function rerenderLesson(id) {

async function saveReport(id) {
