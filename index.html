      <div class="muted small" style="margin-bottom:8px">רק כתובות מייל שרשומות כאן יכולות להיכנס למערכת. <b>מורה</b> רואה ומדווחת רק על השיעורים שלה. <b>הנהלה</b> צופה בלוח הבקרה ובמערכת השעות. <b>רכזת</b> יכולה לנהל הכול.</div>`;
    html += d.users.slice().sort((a, b) => a.name.localeCompare(b.name, 'he')).map(u => `<div class="card${u.active === 'לא' ? ' dim' : ''}"><div class="list-item"><div class="grow">
        <b>${h(u.name)}</b> <span class="tag">${h(u.role)}</span>${u.active === 'לא' ? '<span class="tag">לא פעילה</span>' : ''}
        <div class="small muted" dir="ltr" style="text-align:right">${h(u.email)}</div></div>
        <button class="btn sm" data-a="user-edit" data-v="${h(u.email)}">עריכה</button></div></div>`).join('');
  }

  if (A.sub === 'holidays') {
    html += `<div class="card"><b>הוספת חופשה / יום ללא לימודים</b>
      <div class="row" style="margin-top:8px"><div class="grow"><label class="f">מתאריך</label><input type="date" id="hol-from"></div><div class="grow"><label class="f">עד תאריך (לא חובה)</label><input type="date" id="hol-to"></div></div>
      <label class="f">תיאור</label><input type="text" id="hol-desc" placeholder="לדוגמה: חופשת חנוכה">
      <div class="form-actions"><button class="btn pri" data-a="hol-add">הוספה</button></div>
      <div class="muted small" style="margin-top:6px">בימים האלה לא ייווצרו שיעורים, והם לא ייחשבו כשיעורים שלא התקיימו.</div></div>`;
    html += d.holidays.length ? d.holidays.map(x => `<div class="card list-item${(x.to || x.from) < S.today ? ' dim' : ''}"><div class="grow"><b>${h(x.description || 'חופשה')}</b>
        <div class="small muted">${fmtFull(x.from)}${x.to && x.to !== x.from ? ' – ' + fmtFull(x.to) : ''}</div></div>
        <button class="btn sm danger" data-a="hol-del" data-v="${h(x.id)}">מחיקה</button></div>`).join('') : '<div class="empty">לא הוגדרו חופשות</div>';
  }

  if (A.sub === 'settings') {
    const s = d.settings, hours = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
    if (!A.periodsDraft) A.periodsDraft = (s.periods && s.periods.length ? s.periods : periods()).map(p => Object.assign({}, p));
    if (A.boardingDraft == null) A.boardingDraft = s.boardingDay != null ? s.boardingDay : boardingDay();
    html += `<div class="card"><b>שעות המערכת (צלצולים)</b>
      <div class="muted small" style="margin-top:4px">לפי השעות האלה בנויה מערכת השעות. שיעור משובץ לשעה שבה הוא מתחיל.</div>
      ${A.periodsDraft.map((p, i) => `<div class="per-row"><b>שעה ${i + 1}</b><input type="time" class="per-s" value="${h(p.start)}"><span>עד</span><input type="time" class="per-e" value="${h(p.end)}"><button class="btn sm ghost danger" data-a="per-del" data-v="${i}" title="הסרה">✕</button></div>`).join('')}
      <button class="linkbtn" data-a="per-add">+ הוספת שעה</button>
      <label class="f">יום פנימיה (יום שבו חלק מהשעות זזות)</label>
      <select id="set-bday" style="width:auto"><option value="">אין</option>${S.boot.days.map(x => opt(x, x, A.boardingDraft)).join('')}</select>
      <div class="muted small" style="margin-top:6px">שעות שונות ביום פנימיה (רק לשעות שמשתנות):</div>
      ${A.periodsDraft.map((p, i) => `<div class="per-row"><b>שעה ${i + 1}</b><input type="time" class="per-bs" value="${h(p.bStart || '')}"><span>עד</span><input type="time" class="per-be" value="${h(p.bEnd || '')}"></div>`).join('')}
    </div>
    <div class="card"><b>תזכורות במייל למורות</b>
      <label class="row" style="margin-top:12px;gap:8px;font-size:16px"><input type="checkbox" id="set-on"${s.remindersOn ? ' checked' : ''} style="width:20px;height:20px"> לשלוח לכל מורה תזכורת יום לפני השיעורים שלה</label>
      <div class="row" style="margin-top:6px">
        <div class="grow"><label class="f">שעת שליחה בימים א׳–ה׳</label><select id="set-hour">${hours(8, 21).map(x => opt(x, String(x).padStart(2, '0') + ':00', s.reminderHour)).join('')}</select></div>
        <div class="grow"><label class="f">ביום שישי (לשיעורי יום ראשון)</label><select id="set-fri">${hours(7, 12).map(x => opt(x, String(x).padStart(2, '0') + ':00', s.fridayHour)).join('')}</select></div>
      </div>
      <div class="muted small" style="margin-top:8px">התזכורת כוללת את רשימת השיעורים של היום הבא, קישור לדיווח, וציון של שיעורים שעדיין לא דווחו. בשבת לא נשלחות תזכורות, והתזכורת לשיעורי יום ראשון נשלחת ביום שישי. בחופשות לא נשלח דבר.</div>
      <div class="form-actions"><button class="btn" data-a="set-test">שליחת תזכורת לדוגמה אליי</button></div>
    </div>
    <div class="card"><b>סיכום שבועי לרכזת</b>
      <label class="row" style="margin-top:12px;gap:8px;font-size:16px"><input type="checkbox" id="set-weekly"${s.weeklyOn ? ' checked' : ''} style="width:20px;height:20px"> לשלוח כל יום ראשון בבוקר סיכום של השבוע שעבר</label>
      <div class="row" style="margin-top:6px">
        <div class="grow"><label class="f">שעת שליחה ביום ראשון</label><select id="set-whour">${hours(7, 12).map(x => opt(x, String(x).padStart(2, '0') + ':00', s.weeklyHour)).join('')}</select></div>
        <label class="row grow" style="gap:8px;margin-top:22px"><input type="checkbox" id="set-wmgr"${s.weeklyToManagers ? ' checked' : ''} style="width:18px;height:18px"> לשלוח גם להנהלה</label>
      </div>
      <div class="muted small" style="margin-top:8px">הסיכום כולל את המימוש של כל תלמידה (עם סימון אדום לתלמידות מתחת לסף), דיווחים חסרים לפי מורה, והשלמות פתוחות.</div>
      <div class="form-actions"><button class="btn" data-a="set-test-weekly">שליחת סיכום לדוגמה אליי</button></div>
    </div>
    <div class="card"><b>סף התראה על מימוש נמוך</b>
      <div class="row" style="margin-top:8px"><input type="number" id="set-thr" min="10" max="100" step="5" value="${s.lowThreshold}" style="width:90px"> <span>%</span></div>
      <div class="muted small" style="margin-top:6px">תלמידה שאחוז המימוש שלה (נכחה מתוך השיעורים שתוכננו) נמוך מהסף תסומן באדום בלוח הבקרה ובסיכום השבועי. ההתראה מופיעה רק אחרי לפחות 3 שיעורים בתקופה, כדי שלא תהיה התראה מיותרת בתחילת שבוע.</div>
    </div>
    <div class="form-actions"><button class="btn pri" data-a="set-save">שמירת כל ההגדרות</button></div>`;
  }

  if (A.sub === 'history') {
    if (!A.history) { html += '<div class="empty">טוען…</div>'; loadHistory(); }
    else {
      const list = A.history.filter(x => !A.histTeacher || x.teacherEmail === A.histTeacher);
      html += `<div class="card"><div class="muted small" style="margin-bottom:8px">כל דיווח חדש וכל שינוי בדיווח קיים נרשמים כאן אוטומטית, כולל מה היה לפני השינוי. מוצגים 500 השינויים האחרונים, והיומן המלא נשמר בגיליון בלשונית "יומן שינויים".</div>
        <select data-a="hist-teacher"><option value="">כל המורות</option>${d.users.filter(u => u.role !== ROLE_MANAGER).map(u => opt(u.email.toLowerCase(), u.name, A.histTeacher)).join('')}</select></div>`;
      html += list.length ? list.map(x => `<div class="card hist${x.before ? ' changed' : ''}">
          <div class="row"><b class="grow">${fmtDate(x.date)} · ${h(x.subject)} · ${h(x.teacherName)}</b><span class="badge ${x.before ? 'b-warn' : 'b-pending'}">${h(x.action)}</span></div>
          <div class="muted small" style="margin-top:2px">${h(fmtStamp(x.at))} · ${h(x.byName)}</div>
          ${x.before ? `<div class="hist-line before"><span>לפני:</span> ${h(x.before)}</div>` : ''}
          <div class="hist-line"><span>${x.before ? 'אחרי:' : 'דיווח:'}</span> ${h(x.after)}</div>
        </div>`).join('') : '<div class="empty">אין עדיין שינויים</div>';
    }
  }
  document.getElementById('app').innerHTML = html;
}

/* ---------- חלונות עריכה ---------- */
function openModal(html) { document.getElementById('modal-box').innerHTML = html; document.getElementById('modal').classList.remove('hidden'); }
function closeModal() { document.getElementById('modal').classList.add('hidden'); }
function askConfirm(text, action, v) {
  openModal(`<h3>אישור</h3><p>${h(text)}</p><div class="form-actions"><button class="btn pri" data-a="${action}" data-v="${h(v)}">כן</button><button class="btn" data-a="modal-close">ביטול</button></div>`);
}
function val(id) { const el = document.getElementById(id); return el ? el.value : ''; }

function studentModal(s) {
  s = s || { id: '', name: '', className: '', approvedHours: '', active: 'כן', notes: '' };
  openModal(`<h3>${s.id ? 'עריכת תלמידה' : 'תלמידה חדשה'}</h3>
    <label class="f">שם מלא</label><input type="text" id="m-name" value="${h(s.name)}">
    <div class="row"><div class="grow"><label class="f">כיתה</label><input type="text" id="m-class" value="${h(s.className)}" placeholder="לדוגמה: ט2"></div>
    <div class="grow"><label class="f">שעות סל שבועיות</label><input type="number" min="0" step="1" id="m-hours" value="${h(s.approvedHours)}"></div></div>
    <label class="f">הערות</label><textarea id="m-notes">${h(s.notes)}</textarea>
    <label class="f">סטטוס</label><select id="m-active">${opt('כן', 'פעילה', s.active)}${opt('לא', 'לא פעילה (עזבה / סיימה)', s.active)}</select>
    <div class="form-actions"><button class="btn pri" data-a="student-save" data-v="${h(s.id)}">שמירה</button><button class="btn" data-a="modal-close">ביטול</button></div>
    ${s.id ? `<button class="btn ghost danger" style="margin-top:8px" data-a="student-del" data-v="${h(s.id)}">מחיקת התלמידה</button>` : ''}`);
}

/** שיבוצים שהמחיקה תשפיע עליהם – כדי להציג אותם בחלון האישור. */
function slotsOf(kind, key) {
  const d = S.admin.data;
  return d.slots.filter(x => kind === 'user' ? x.teacherEmail.toLowerCase() === key.toLowerCase() : x.studentIds.split(',').includes(key));
}

function confirmDelete(kind, key) {
  const d = S.admin.data;
  const item = kind === 'user' ? d.users.find(u => u.email === key) : d.students.find(s => s.id === key);
  if (!item) return;
  const n = slotsOf(kind, key).length;
  const who = kind === 'user' ? 'המורה' : 'התלמידה';
  const slotsNote = !n ? '' : kind === 'user'
    ? `<p>למורה יש <b>${n === 1 ? 'שיבוץ אחד' : n + ' שיבוצים'}</b>, ${n === 1 ? 'והוא יימחק' : 'והם יימחקו'} יחד איתה.</p>`
    : `<p>לתלמידה יש <b>${n === 1 ? 'שיבוץ אחד' : n + ' שיבוצים'}</b>. היא תוסר מהם, ושיבוץ שנשאר בלי תלמידות יימחק.</p>`;
  openModal(`<h3>מחיקת ${h(item.name)}</h3>${slotsNote}
    <p class="muted small">אם ${who} כבר הופיעה בשיעורים שדווחו, אי אפשר למחוק אותה כדי לא לאבד את ההיסטוריה. במקרה כזה אפשר לסמן אותה "לא פעילה".</p>
    <div class="form-actions"><button class="btn danger" data-a="${kind}-del-yes" data-v="${h(key)}">מחיקה</button><button class="btn pri" data-a="modal-close">ביטול</button></div>`);
}

function userModal(u) {
  u = u || { email: '', name: '', role: ROLE_TEACHER, active: 'כן' };
  openModal(`<h3>${u.email ? 'עריכת משתמשת' : 'משתמשת חדשה'}</h3>
    <label class="f">שם</label><input type="text" id="m-name" value="${h(u.name)}">
    <label class="f">כתובת מייל (משמשת לכניסה)</label><input type="email" id="m-email" dir="ltr" value="${h(u.email)}">
    <label class="f">תפקיד</label><select id="m-role">${[ROLE_TEACHER, ROLE_COORD, ROLE_MANAGER].map(r => opt(r, r, u.role)).join('')}</select>
    <label class="f">סטטוס</label><select id="m-active">${opt('כן', 'פעילה', u.active)}${opt('לא', 'לא פעילה (אין כניסה)', u.active)}</select>
    <div class="form-actions"><button class="btn pri" data-a="user-save" data-v="${h(u.email)}">שמירה</button><button class="btn" data-a="modal-close">ביטול</button></div>
    ${u.email && u.email.toLowerCase() !== S.boot.user.email ? `<button class="btn ghost danger" style="margin-top:8px" data-a="user-del" data-v="${h(u.email)}">מחיקת המשתמשת</button>` : ''}`);
}

/**
 * חלון שיעור (שיבוץ). pre: { student, teacher, day, time } – כשנפתח מלחיצה על משבצת במערכת השעות.
 * השדות הפחות נחוצים (תאריכי תוקף, ולפעמים גם יום ושעה) מוסתרים תחת "אפשרויות נוספות".
 */
async function slotModal(slotId, pre) {
  if (typeof pre === 'string') pre = { student: pre };
  pre = pre || {};
  let d = S.admin.data;
  if (!d) { try { d = S.admin.data = await call('adminData'); } catch (e) { return fail(e); } }
  const s = slotId ? d.slots.find(x => x.id === slotId) : null;
  const v = s || { id: '', teacherEmail: pre.teacher || '', subject: '', day: pre.day || '', time: pre.time || '', studentIds: pre.student || '', validFrom: S.today, validTo: '' };
  const chosen = v.studentIds ? v.studentIds.split(',') : [];
  const subjects = uniq(d.slots.map(x => x.subject));
  const students = d.students.filter(x => x.active !== 'לא' || chosen.includes(x.id)).sort((a, b) => a.className.localeCompare(b.className, 'he') || a.name.localeCompare(b.name, 'he'));
  const stuName = id => (d.students.find(x => x.id === id) || {}).name || '?';
  const teachers = d.users.filter(u => (u.active !== 'לא' || u.email.toLowerCase() === v.teacherEmail) && u.role !== ROLE_MANAGER).sort((a, b) => a.name.localeCompare(b.name, 'he'));
  const fromGrid = !s && pre.day && pre.time;
  const pIdx = v.time ? periodOf(v.time, v.day) : -1;
  const exact = pIdx >= 0 && periodsFor(v.day)[pIdx].start === padT(v.time);
  const periodVal = !v.time ? '' : exact ? String(pIdx) : 'other';

  const dayTime = `<div class="row"><div class="grow"><label class="f">יום</label><select id="m-day"><option value="">בחרי…</option>${S.boot.days.map(x => opt(x, x, v.day)).join('')}</select></div>
    <div class="grow"><label class="f">שעה במערכת</label><select id="m-period">${periodOptions(v.day, periodVal)}</select></div></div>
    <div id="m-time-box" class="${periodVal === 'other' ? '' : 'hidden'}"><label class="f">שעת התחלה</label><input type="time" id="m-time" value="${h(padT(v.time))}"></div>`;
  const dates = s ? `<label class="f">השינוי בתוקף מתאריך</label><input type="date" id="m-eff" value="${S.today}">
         <div class="muted small">שיעורים שדווחו לפני התאריך הזה יישארו כפי שהם.</div>`
      : `<label class="f">מתחיל בתאריך</label><input type="date" id="m-from" value="${h(v.validFrom)}">`;

  openModal(`<h3>${s ? 'עריכת שיעור' : 'שיעור חדש'}</h3>
    ${fromGrid ? `<div class="modal-sub">${pre.student ? h(stuName(pre.student)) + ' · ' : ''}${h(whenText(v.day, v.time))}</div>` : ''}
    <label class="f">מורה</label><select id="m-teacher"><option value="">בחרי מורה…</option>${teachers.map(u => opt(u.email.toLowerCase(), u.name, v.teacherEmail)).join('')}<option value="__new">+ מורה חדשה…</option></select>
    <div id="m-newt" class="hidden card" style="margin:8px 0 0;background:#f9fafb">
      <div class="small muted">המורה תתווסף לרשימת המורות. היא לא תקבל שום הודעה עד שתשלחי לה את הקישור.</div>
      <label class="f">שם המורה</label><input type="text" id="m-tname">
      <label class="f">המייל שהיא בודקת (אליו יגיע קוד הכניסה)</label><input type="email" id="m-temail" dir="ltr">
    </div>
    <label class="f">מקצוע</label><input type="text" id="m-subject" list="subj-list" value="${h(v.subject)}" placeholder="לדוגמה: מתמטיקה"><datalist id="subj-list">${subjects.map(x => `<option value="${h(x)}">`).join('')}</datalist>
    ${fromGrid ? '' : dayTime}
    <label class="f">תלמידות בשיעור</label>
    ${chosen.length ? `<div>${chosen.map(id => `<b>${h(stuName(id))}</b>`).join(', ')}</div><button class="linkbtn" data-a="m-more-stu">${chosen.length > 1 ? 'שינוי התלמידות בשיעור' : '+ להוסיף עוד תלמידה (שיעור קבוצתי)'}</button>` : ''}
    <div id="m-stu-box" class="${chosen.length ? 'hidden' : ''}"><div class="checks">${students.map(x => `<label><input type="checkbox" class="m-stu" value="${h(x.id)}"${chosen.includes(x.id) ? ' checked' : ''}> ${h(x.name)} <span class="muted small">${h(x.className)}</span></label>`).join('') || '<div class="muted small">יש להוסיף תלמידות קודם</div>'}</div></div>
    <div id="m-conf"></div>
    <details style="margin-top:10px"><summary>אפשרויות נוספות</summary>
      ${fromGrid ? dayTime : ''}
      ${dates}
      <label class="f">מסתיים בתאריך (לא חובה)</label><input type="date" id="m-to" value="${h(v.validTo)}">
      <div class="muted small">בלי תאריך סיום, השיעור חוזר כל שבוע עד שמסירים אותו.</div>
    </details>
    <div class="form-actions"><button class="btn pri" data-a="slot-save" data-v="${h(v.id)}">שמירה</button><button class="btn" data-a="modal-close">ביטול</button></div>
    ${s ? `<button class="btn ghost danger" style="margin-top:8px" data-a="slot-del" data-v="${h(v.id)}">הסרת השיעור מהמערכת</button>` : ''}`);
  S.admin.editingSlot = v.id;
  slotConflictHint();
}

function periodOptions(day, sel) {
  return `<option value="">בחרי…</option>${periodsFor(day).map((p, i) => opt(String(i), `שעה ${i + 1} · ${periodRange(i, day)}`, sel)).join('')}<option value="other"${sel === 'other' ? ' selected' : ''}>שעה אחרת…</option>`;
}
function slotFormTime() {
  const p = val('m-period');
  if (p === 'other') return val('m-time');
  const x = p === '' ? null : periodsFor(val('m-day'))[Number(p)];
  return x ? x.start : '';
}

/** אזהרה (לא חוסמת) כשלמורה או לתלמידה כבר יש שיעור באותה שעה. */
function slotConflictHint() {
  const box = document.getElementById('m-conf'), d = S.admin.data;
  if (!box || !d) return;
  const probe = { id: S.admin.editingSlot || '', teacherEmail: val('m-teacher'), day: val('m-day'), time: slotFormTime(),
    studentIds: [...document.querySelectorAll('.m-stu:checked')].map(x => x.value).join(','), validFrom: val('m-from') || val('m-eff') || S.today, validTo: val('m-to') };
  if (!probe.day || !probe.time) { box.innerHTML = ''; return; }
  const live = d.slots.filter(x => !x.validTo || x.validTo >= S.today);
  const tName = {}; d.users.forEach(u => { tName[u.email.toLowerCase()] = u.name; });
  const stuName = id => (d.students.find(x => x.id === id) || {}).name || '?';
  const conf = conflictsOf(probe, live);
  box.innerHTML = conf.length ? `<div class="warnbox">⚠ בשעה הזו כבר יש: ${conf.map(o => `${h(o.subject)} של ${h(tName[o.teacherEmail] || o.teacherEmail)} עם ${h(o.studentIds.split(',').map(stuName).join(', '))}`).join('; ')}. אפשר לשמור בכל זאת.</div>` : '';
}

async function saveSlotForm(id) {
  let teacher = val('m-teacher');
  if (teacher === '__new') {
    const name = val('m-tname').trim(), email = val('m-temail').trim().toLowerCase();
    if (!name || !email) return toast('יש להזין שם ומייל למורה החדשה', true);
    try { await call('saveUser', { email, name, role: ROLE_TEACHER, active: 'כן' }); } catch (e) { return fail(e); }
    // המורה נוצרה – מעדכנים את החלון כדי שלא תיווצר שוב אם שמירת השיעור תיכשל
    S.admin.data.users.push({ email, name, role: ROLE_TEACHER, active: 'כן' });
    const sel = document.getElementById('m-teacher');
    sel.insertAdjacentHTML('afterbegin', opt(email, name, email)); sel.value = email;
    document.getElementById('m-newt').classList.add('hidden');
    S._bootStale = true;
    teacher = email;
  }
  await adminSave('saveSlot', {
    id, teacherEmail: teacher, subject: val('m-subject'), day: val('m-day'), time: slotFormTime(),
    studentIds: [...document.querySelectorAll('.m-stu:checked')].map(x => x.value),
    validFrom: val('m-from'), validTo: val('m-to'), effectiveFrom: val('m-eff'),
  }, id ? 'השיעור עודכן ✓' : 'השיעור נוסף ✓');
}

function readPeriods() {
  const g = c => [...document.querySelectorAll(c)].map(x => x.value);
  const st = g('.per-s'), en = g('.per-e'), bs = g('.per-bs'), be = g('.per-be');
  if (document.getElementById('set-bday')) S.admin.boardingDraft = val('set-bday');
  return st.map((start, i) => Object.assign({ start, end: en[i] }, bs[i] && be[i] ? { bStart: bs[i], bEnd: be[i] } : {}));
}

async function saveSettingsForm() {
  const chk = id => document.getElementById(id).checked;
  const ps = readPeriods().filter(p => p.start || p.end);
  if (!ps.length) return toast('יש להגדיר לפחות שעה אחת במערכת', true);
  const bad = ps.findIndex(p => !p.start || !p.end || p.end <= p.start || (p.bStart && p.bEnd <= p.bStart));
  if (bad >= 0) return toast(`בשעה ${bad + 1} חסרה שעה, או ששעת הסיום לא אחרי שעת ההתחלה`, true);
  try {
    const r = await call('saveSettings', {
      remindersOn: chk('set-on'), reminderHour: val('set-hour'), fridayHour: val('set-fri'),
      weeklyOn: chk('set-weekly'), weeklyHour: val('set-whour'), weeklyToManagers: chk('set-wmgr'), lowThreshold: val('set-thr'),
      periods: ps, boardingDay: val('set-bday'),
    });
    const b = await call('bootstrap');
    S.boot.threshold = b.threshold;
    if (r && r.periods) { S.boot.periods = r.periods; S.boot.boardingDay = r.boardingDay || ''; toast('ההגדרות נשמרו'); }
    else toast('ההגדרות נשמרו. שעות המערכת יישמרו אחרי עדכון השרת.', true);
    loadAdmin();
  } catch (e) { fail(e); }
}

async function adminSave(action, payload, msg) {
  try {
    await call(action, payload);
    closeModal(); toast(msg || 'נשמר ✓');
    if (action === 'saveUser' || action === 'deleteUser' || S._bootStale) { S._bootStale = false; S.boot = Object.assign(S.boot, await call('bootstrap')); }
    if (S.tab === 'admin') loadAdmin(); else { S.admin.data = null; if (S.tab === 'sched') loadSched(); }
  } catch (e) {
    if (/פעולה לא מוכרת/.test(e.message || '')) {
      return toast('האפשרות הזו תעבוד אחרי עדכון השרת. בינתיים אפשר לסמן "לא פעילה".', true);
    }
    fail(e);
  }
}

/* ============================== אירועים ============================== */
document.addEventListener('click', e => {
  if (e.target.id === 'modal') return closeModal();
  const el = e.target.closest('[data-a]');
  if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  const a = el.dataset.a, v = el.dataset.v, id = el.dataset.id;
  const f = id ? S.forms[id] : null;
  switch (a) {
    case 'login-send': return loginSend();
    case 'login-verify': return loginVerify();
    case 'login-back': S.login.step = 'email'; return showLogin();
    case 'logout': return confirmLogout();
    case 'logout-yes': return logout();
    case 'install-now': return installNow();
    case 'install-later': return installLater();
    case 'tab': return go(v);
    case 'modal-close': return closeModal();

    case 'day-move': S.day.date = addDays(S.day.date, Number(v)); return loadDay();
    case 'day-today': S.day.date = S.today; return loadDay();
    case 'open-form': formFor(findLesson(id)).open = true; return rerenderLesson(id);
    case 'close-form': delete S.forms[id]; return rerenderLesson(id);
    case 'choose': {
      const l = findLesson(id), sid = l.students[0].id;
      if (v === 'hp' || v === 'ha') { f.status = HELD; f.att[sid].present = v === 'hp'; }
      else f.status = { h: HELD, n: NOT_HELD, p: POSTPONED }[v];
      return rerenderLesson(id);
    }
    case 'att': f.att[el.dataset.sid].present = v === '1'; return rerenderLesson(id);
    case 'save-report': return saveReport(id);

    case 'range-preset': {
      const k = el.dataset.k, st = S[k];
      st.preset = v;
      if (v === 'custom') { const [a1, b1] = presetRange('month', st); st.from = st.from || a1; st.to = st.to || b1; return k === 'dash' ? renderDash() : renderReports(); }
      return loadRange(k);
    }
    case 'range-custom': {
      const k = el.dataset.k, st = S[k];
      st.from = val(k + '-from'); st.to = val(k + '-to');
      if (!st.from || !st.to || st.from > st.to) return toast('טווח תאריכים לא תקין', true);
      return loadRange(k);
    }
    case 'dash-student': S.dash.f.student = S.dash.f.student === v ? '' : v; return renderDash();
    case 'rep-view': S.rep.view = v; return renderReports();
    case 'rep-print': return window.print();
    case 'rep-xlsx': return exportXlsx();
    case 'rep-gsheet': return exportGSheet();
    case 'set-save': return saveSettingsForm();
    case 'set-test': return call('testReminder').then(r => toast(`נשלח מייל בדיקה אל ${r.sentTo} (דוגמה של ${r.sample})`)).catch(fail);
    case 'set-test-weekly': return call('testWeekly').then(r => toast(`נשלח סיכום לדוגמה (${fmtDate(r.from, false)}–${fmtDate(r.to, false)}) אל ${r.sentTo.join(', ')}`)).catch(fail);

    case 'admin-sub': S.admin.sub = v; if (v === 'settings') { S.admin.periodsDraft = null; S.admin.boardingDraft = null; } return renderAdmin();
    case 'student-new': return studentModal();
    case 'student-edit': return studentModal(S.admin.data.students.find(s => s.id === v));
    case 'student-save': return adminSave('saveStudent', { id: v, name: val('m-name'), className: val('m-class'), approvedHours: val('m-hours'), notes: val('m-notes'), active: val('m-active') });
    case 'user-new': return userModal();
    case 'user-edit': return userModal(S.admin.data.users.find(u => u.email === v));
    case 'user-save': return adminSave('saveUser', { originalEmail: v, email: val('m-email'), name: val('m-name'), role: val('m-role'), active: val('m-active') });
    case 'user-del': return confirmDelete('user', v);
    case 'user-del-yes': return adminSave('deleteUser', { email: v }, 'המשתמשת נמחקה');
    case 'student-del': return confirmDelete('student', v);
    case 'student-del-yes': return adminSave('deleteStudent', { id: v }, 'התלמידה נמחקה');
    case 'slot-new': return slotModal('', el.dataset.stu || '');
    case 'admin-more': S.admin.more = !(S.admin.more || ['history', 'settings'].includes(S.admin.sub)); if (!S.admin.more && ['history', 'settings'].includes(S.admin.sub)) S.admin.sub = 'students'; return renderAdmin();
    case 'per-add': case 'per-del': {
      const cur = readPeriods();
      if (a === 'per-add') { const last = cur[cur.length - 1]; cur.push({ start: last ? last.end : '08:00', end: '' }); }
      else cur.splice(Number(v), 1);
      S.admin.periodsDraft = cur; return renderAdmin();
    }
    case 'tt-view': S.sched.view = v; return renderSched();
    case 'tt-step': {
      const sel = document.querySelector('[data-a="tt-pick"]'), i = sel.selectedIndex + Number(v);
      if (i < 0 || i >= sel.options.length) return;
      S.sched[S.sched.view] = sel.options[i].value; return renderSched();
    }
    case 'tt-day': S.sched.day = v; return renderSched();
    case 'tt-add': return slotModal('', S.sched.view === 'student' ? { student: S.sched.student, day: el.dataset.day, time: el.dataset.time } : { teacher: S.sched.teacher, day: el.dataset.day, time: el.dataset.time });
    case 'tt-open': S.sched.view = 'student'; S.sched.student = v; return go('sched');
    case 'm-more-stu': document.getElementById('m-stu-box').classList.remove('hidden'); el.remove(); return;
    case 'slot-edit': return slotModal(v);
    case 'slot-save': return saveSlotForm(v);
    case 'slot-del': return askConfirm('להסיר את השיבוץ? אם כבר דווחו עליו שיעורים, הוא רק יסתיים והדיווחים יישמרו.', 'slot-del-yes', v);
    case 'slot-del-yes': return adminSave('deleteSlot', { id: v }, 'השיבוץ הוסר');
    case 'hol-add': return adminSave('saveHoliday', { from: val('hol-from'), to: val('hol-to'), description: val('hol-desc') }, 'החופשה נוספה');
    case 'hol-del': return askConfirm('למחוק את החופשה?', 'hol-del-yes', v);
    case 'hol-del-yes': return adminSave('deleteHoliday', { id: v }, 'נמחק');
  }
});

document.addEventListener('change', e => {
  const el = e.target, a = el.dataset.a;
  if (a === 'day-teacher') { S.day.teacher = el.value; return loadDay(); }
  if (a === 'day-pick') { if (el.value) { S.day.date = el.value; loadDay(); } return; }
  if (a === 'filter') { const k = el.dataset.s; S[k].f[el.dataset.k] = el.value; return k === 'dash' ? renderDash() : renderReports(); }
  if (a === 'rep-student') { S.rep.student = el.value; return renderReports(); }
  if (a === 'tt-pick') { S.sched[S.sched.view] = el.value; return renderSched(); }
  if (el.id === 'm-teacher') { document.getElementById('m-newt').classList.toggle('hidden', el.value !== '__new'); return slotConflictHint(); }
  if (el.id === 'm-period') { document.getElementById('m-time-box').classList.toggle('hidden', el.value !== 'other'); return slotConflictHint(); }
  if (el.id === 'm-day') { const ps = document.getElementById('m-period'), cur = ps.value; ps.innerHTML = periodOptions(el.value, cur); return slotConflictHint(); }
  if (el.id === 'm-time' || el.classList.contains('m-stu')) return slotConflictHint();
  if (a === 'hist-teacher') { S.admin.histTeacher = el.value; return renderAdmin(); }
  const fld = el.dataset.f, id = el.dataset.id;
  if (!fld || !S.forms[id]) return;
  const f = S.forms[id];
  if (fld === 'reason') { f.reason = el.value; return rerenderLesson(id); }
  if (fld === 'attReason') { f.att[el.dataset.sid].reason = el.value; return rerenderLesson(id); }
});

document.addEventListener('input', e => {
  const el = e.target, fld = el.dataset.f, id = el.dataset.id;
  if (!fld || !S.forms[id]) return;
  const f = S.forms[id];
  if (fld === 'attReasonText') f.att[el.dataset.sid].reasonText = el.value;
  else if (fld !== 'reason' && fld !== 'attReason') f[fld] = el.value;
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'lg-email') loginSend();
  if (e.target.id === 'lg-code') loginVerify();
});

init();
showInstall();
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
