/* ============================== טווחי תאריכים, מסננים וחישוב (משותף ללוח הבקרה ולדוחות) ============================== */
const PRESETS = [['week', 'השבוע'], ['lastweek', 'שבוע שעבר'], ['month', 'החודש'], ['lastmonth', 'חודש שעבר'], ['custom', 'טווח אחר']];

function presetRange(p, st) {
  const t = S.today, sow = addDays(t, -weekday(t));
  const [y, m] = t.split('-').map(Number);
  const monthStart = (yy, mm) => `${yy}-${String(mm).padStart(2, '0')}-01`;
  const monthEnd = (yy, mm) => addDays(mm === 12 ? monthStart(yy + 1, 1) : monthStart(yy, mm + 1), -1);
  if (p === 'week') return [sow, addDays(sow, 6)];
  if (p === 'lastweek') return [addDays(sow, -7), addDays(sow, -1)];
  if (p === 'month') return [monthStart(y, m), monthEnd(y, m)];
  if (p === 'lastmonth') { const yy = m === 1 ? y - 1 : y, mm = m === 1 ? 12 : m - 1; return [monthStart(yy, mm), monthEnd(yy, mm)]; }
  return [st.from, st.to];
}

async function loadRange(key) {
  const st = S[key];
  if (st.preset !== 'custom') [st.from, st.to] = presetRange(st.preset, st);
  try { st.data = await call('dashboard', { from: st.from, to: st.to }); (key === 'dash' ? renderDash : renderReports)(); } catch (e) { fail(e); }
}
function loadDash() { return loadRange('dash'); }

function rangeHtml(key) {
  const st = S[key];
  return `<div class="chips">${PRESETS.map(([k, l]) => `<button class="chip${st.preset === k ? ' on' : ''}" data-a="range-preset" data-k="${key}" data-v="${k}">${l}</button>`).join('')}</div>
    ${st.preset === 'custom' ? `<div class="row" style="margin-top:10px"><label class="small">מ־</label><input type="date" id="${key}-from" value="${st.from}" style="width:auto"><label class="small">עד</label><input type="date" id="${key}-to" value="${st.to}" style="width:auto"><button class="btn sm pri" data-a="range-custom" data-k="${key}">הצגה</button></div>` : ''}
    <div class="muted small" style="margin-top:8px">${fmtFull(st.data.from)} – ${fmtFull(st.data.to)}</div>`;
}

function filtersHtml(key, withStudent) {
  const st = S[key], d = st.data, f = st.f;
  const sel = (k, all, options) => `<select data-a="filter" data-s="${key}" data-k="${k}"><option value="">${all}</option>${options}</select>`;
  return `<div class="filters">
    ${withStudent ? sel('student', 'כל התלמידות', d.students.slice().sort((a, b) => a.name.localeCompare(b.name, 'he')).map(s => opt(s.id, s.name, f.student)).join('')) : ''}
    ${sel('className', 'כל הכיתות', uniq(d.students.map(s => s.className)).map(x => opt(x, x, f.className)).join(''))}
    ${sel('teacher', 'כל המורות', d.teachers.filter(t => t.role !== ROLE_MANAGER).map(t => opt(t.email, t.name, f.teacher)).join(''))}
    ${sel('subject', 'כל המקצועות', uniq(d.lessons.map(l => l.subject)).map(x => opt(x, x, f.subject)).join(''))}
  </div>`;
}

/** מחשב את כל המדדים מתוך רשימת השיעורים בטווח, לפי המסננים. */
function computeStats(d, f) {
  const today = d.today;
  const stuOk = s => (!f.student || s.id === f.student) && (!f.className || s.className === f.className);
  const lessons = d.lessons.filter(l => (!f.teacher || l.teacherEmail === f.teacher) && (!f.subject || l.subject === f.subject) && l.students.some(stuOk));
  const studentInfo = {}; d.students.forEach(s => { studentInfo[s.id] = s; });
  const per = {}, tot = { planned: 0, held: 0, present: 0, absent: 0, notHeld: 0, postponed: 0, missingL: 0, openMakeups: 0 };
  const lessonReasons = {}, absenceReasons = {}, teachers = {};
  const missing = [], openMakeups = [];
  const newRow = s => ({ s, planned: 0, due: 0, held: 0, present: 0, absent: 0, notHeld: 0, postponed: 0, missing: 0, reasons: {}, missingTeachers: {} });
  d.students.filter(s => s.active !== 'לא' && stuOk(s)).forEach(s => { per[s.id] = newRow(s); });
  const addReason = (m, r) => { if (r) m[r] = (m[r] || 0) + 1; };

  lessons.forEach(l => {
    const t = teachers[l.teacherEmail] = teachers[l.teacherEmail] || { name: l.teacherName, planned: 0, due: 0, reported: 0, held: 0, notHeld: 0, postponed: 0, missing: 0 };
    const sched = l.kind !== 'השלמה';
    const isMissing = !l.status && l.date < today;
    if (sched) t.planned++;
    if (l.status || l.date < today) t.due++;
    if (l.status) t.reported++;
    if (isMissing) { t.missing++; tot.missingL++; missing.push(l); }
    if (l.status === HELD) t.held++;
    if (l.status === NOT_HELD) { t.notHeld++; addReason(lessonReasons, l.reason); }
    if (l.status === POSTPONED) {
      t.postponed++; addReason(lessonReasons, l.reason);
      if (l.makeupStatus !== HELD && l.makeupStatus !== POSTPONED) { openMakeups.push(l); tot.openMakeups++; }
    }
    l.students.filter(stuOk).forEach(s => {
      const p = per[s.id] || (per[s.id] = newRow(studentInfo[s.id] || s));
      if (sched) { p.planned++; tot.planned++; if (l.status || l.date < today) p.due++; }
      if (isMissing) { p.missing++; p.missingTeachers[l.teacherName] = 1; }
      if (l.status === HELD) {
        p.held++; tot.held++;
        if (s.present === false) { p.absent++; tot.absent++; addReason(absenceReasons, s.reason); } else { p.present++; tot.present++; }
      }
      if (l.status === NOT_HELD) { p.notHeld++; tot.notHeld++; addReason(p.reasons, l.reason); }
      if (l.status === POSTPONED) { p.postponed++; tot.postponed++; addReason(p.reasons, l.reason); }
    });
  });
  const rows = Object.values(per).sort((a, b) => {
    const ra = a.due ? a.present / a.due : 2, rb = b.due ? b.present / b.due : 2;
    return ra - rb || a.s.name.localeCompare(b.s.name, 'he');
  });
  return { lessons, rows, tot, lessonReasons, absenceReasons, stuOk, teachers: Object.values(teachers).sort((a, b) => b.missing - a.missing || a.name.localeCompare(b.name, 'he')), missing, openMakeups };
}

function barsHtml(map, emptyText) {
  const e = Object.entries(map).sort((a, b) => b[1] - a[1]);
  if (!e.length) return `<div class="muted small">${emptyText}</div>`;
  const max = e[0][1];
  return '<div class="bars">' + e.map(([k, v]) => `<div class="b"><div class="t">${h(k)}</div><div class="track"><i style="width:${v / max * 100}%"></i></div><b>${v}</b></div>`).join('') + '</div>';
}

/* ============================== לוח בקרה ============================== */
function renderDash() {
  const D = S.dash, d = D.data;
  const c = computeStats(d, D.f);
  let html = `<div class="card">${rangeHtml('dash')}${filtersHtml('dash', true)}</div>`;

  const low = c.rows.filter(isLow);
  if (low.length) {
    html += `<div class="alert bad"><b>⚠ ${low.length === 1 ? 'תלמידה אחת' : low.length + ' תלמידות'} מתחת ל־${threshold()}% מימוש בתקופה הזו:</b> ` +
      low.map(r => `<a href="#" class="low-link" data-a="dash-student" data-v="${h(r.s.id)}">${h(r.s.name)} (${Math.round(r.present / r.due * 100)}%)</a>`).join(', ') + '</div>';
  }

  const T = c.tot;
  html += `<div class="kpis">
    <div class="kpi"><div class="v">${T.planned}</div><div class="l">שעות שתוכננו</div></div>
    <div class="kpi ok"><div class="v">${T.held}</div><div class="l">שעות שהתקיימו</div></div>
    <div class="kpi ok"><div class="v">${T.present}</div><div class="l">התלמידה נכחה</div></div>
    <div class="kpi warn"><div class="v">${T.absent}</div><div class="l">התלמידה נעדרה</div></div>
    <div class="kpi bad"><div class="v">${T.notHeld}</div><div class="l">לא התקיימו</div></div>
    <div class="kpi info"><div class="v">${T.postponed}</div><div class="l">נדחו</div></div>
    <div class="kpi bad"><div class="v">${T.missingL}</div><div class="l">דיווחים חסרים</div></div>
    <div class="kpi info"><div class="v">${T.openMakeups}</div><div class="l">השלמות פתוחות</div></div>
  </div>`;

  html += `<h3>מימוש לפי תלמידה</h3>
    <div class="muted small" style="margin-bottom:6px">אחוז המימוש הוא מספר השיעורים שבהם התלמידה נכחה, מתוך השיעורים שכבר היו אמורים להתקיים. התלמידות עם המימוש הנמוך ביותר מופיעות ראשונות. אפשר ללחוץ על שורה כדי לסנן לפיה.</div>
    <div class="tbl-wrap"><table><thead><tr>
      <th class="first">תלמידה</th><th>כיתה</th><th class="num">סל שבועי</th><th class="num">משובצות</th><th class="num">תוכננו</th><th class="num">התקיימו</th><th class="num">נכחה</th><th class="num">נעדרה</th><th class="num">לא התקיימו</th><th class="num">נדחו</th><th class="num">לא דווחו</th><th>מימוש</th>
    </tr></thead><tbody>` +
    (c.rows.length ? c.rows.map(r => {
      const s = r.s, mismatch = s.approvedHours && s.scheduledWeekly !== s.approvedHours;
      return `<tr class="click${isLow(r) ? ' low' : ''}" data-a="dash-student" data-v="${h(s.id)}"><td class="first">${h(s.name)}</td><td>${h(s.className)}</td>
        <td class="num">${s.approvedHours || '—'}</td><td class="num">${mismatch ? `<span class="badge b-warn" title="מספר השעות המשובצות שונה מהסל שאושר">${s.scheduledWeekly} ⚠</span>` : (s.scheduledWeekly || 0)}</td>
        <td class="num">${r.planned}</td><td class="num">${r.held}</td><td class="num">${r.present}</td><td class="num">${r.absent || ''}</td><td class="num">${r.notHeld || ''}</td><td class="num">${r.postponed || ''}</td>
        <td class="num">${r.missing ? `<span class="badge b-bad">${r.missing}</span>` : ''}</td><td>${pctCell(r.present, r.due)}</td></tr>`;
    }).join('') : '<tr><td colspan="12" class="empty">אין נתונים בטווח הזה</td></tr>') + '</tbody></table></div>';

  html += `<h3>לפי מורה</h3><div class="tbl-wrap"><table><thead><tr>
      <th class="first">מורה</th><th class="num">שיעורים שתוכננו</th><th class="num">דווחו</th><th class="num">לא דווחו</th><th class="num">התקיימו</th><th class="num">לא התקיימו</th><th class="num">נדחו</th><th>השלמת דיווח</th>
    </tr></thead><tbody>` +
    (c.teachers.length ? c.teachers.map(t => `<tr><td class="first">${h(t.name)}</td><td class="num">${t.planned}</td><td class="num">${t.reported}</td>
      <td class="num">${t.missing ? `<span class="badge b-bad">${t.missing}</span>` : '0'}</td><td class="num">${t.held}</td><td class="num">${t.notHeld || ''}</td><td class="num">${t.postponed || ''}</td><td>${pctCell(t.reported, t.due)}</td></tr>`).join('')
      : '<tr><td colspan="8" class="empty">אין נתונים</td></tr>') + '</tbody></table></div>';

  html += `<div class="two" style="margin-top:8px">
    <div><h3>למה שיעורים לא התקיימו או נדחו</h3><div class="card">${barsHtml(c.lessonReasons, 'אין שיעורים שבוטלו או נדחו')}</div></div>
    <div><h3>סיבות היעדרות של תלמידות</h3><div class="card">${barsHtml(c.absenceReasons, 'אין היעדרויות')}</div></div>
  </div>`;

  html += `<h3>דיווחים חסרים (${c.missing.length})</h3>` + (c.missing.length
    ? `<div class="tbl-wrap"><table><thead><tr><th>תאריך</th><th>שעה</th><th>מורה</th><th>מקצוע</th><th>תלמידות</th></tr></thead><tbody>` +
      c.missing.map(l => `<tr><td>${fmtDate(l.date)}</td><td>${h(l.time)}</td><td>${h(l.teacherName)}</td><td>${h(l.subject)}</td><td>${h(studentsText(l.students))}</td></tr>`).join('') + '</tbody></table></div>'
    : '<div class="card muted">כל השיעורים דווחו 👍</div>');

  html += `<h3>השלמות פתוחות (${c.openMakeups.length})</h3>` + (c.openMakeups.length
    ? `<div class="tbl-wrap"><table><thead><tr><th>שיעור מקורי</th><th>מורה</th><th>מקצוע</th><th>תלמידות</th><th>מצב ההשלמה</th></tr></thead><tbody>` +
      c.openMakeups.map(l => `<tr><td>${fmtDate(l.date)}</td><td>${h(l.teacherName)}</td><td>${h(l.subject)}</td><td>${h(studentsText(l.students))}</td>
        <td>${!l.makeupDate ? '<span class="badge b-warn">לא נקבע מועד</span>' : l.makeupStatus === NOT_HELD ? '<span class="badge b-bad">ההשלמה לא התקיימה</span>' : `<span class="badge b-info">נקבעה ל${fmtDate(l.makeupDate)}</span>`}</td></tr>`).join('') + '</tbody></table></div>'
    : '<div class="card muted">אין השלמות פתוחות</div>');

  html += `<details class="card" style="margin-top:16px"><summary>פירוט כל השיעורים בטווח (${c.lessons.length})</summary><div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>תאריך</th><th>שעה</th><th>מורה</th><th>מקצוע</th><th>תלמידות</th><th>מצב</th><th>נושא / סיבה</th></tr></thead><tbody>` +
    c.lessons.map(l => { const st = statusInfo(l); return `<tr><td>${fmtDate(l.date)}</td><td>${h(l.time)}</td><td>${h(l.teacherName)}</td><td>${h(l.subject)}${l.kind === 'השלמה' ? ' <span class="tag">השלמה</span>' : ''}</td><td>${h(studentsText(l.students))}</td><td><span class="badge b-${st.cls}">${h(st.text)}</span></td><td style="white-space:normal;min-width:180px">${h(l.topic || (l.reason ? l.reason + (l.reasonText ? ' – ' + l.reasonText : '') : ''))}</td></tr>`; }).join('') +
    '</tbody></table></div></details>';

  document.getElementById('app').innerHTML = html;
}

/* ============================== דוחות ============================== */
function loadReports() { return loadRange('rep'); }

function reasonsText(m) { return Object.entries(m).sort((a, b) => b[1] - a[1]).map(([k, v]) => v > 1 ? `${k} (${v})` : k).join('; '); }
function pctText(n, d) { return d ? Math.min(100, Math.round(n / d * 100)) + '%' : '—'; }
function withText(r, t) { return r ? r + (t ? ' – ' + t : '') : ''; }

/** בונה את טבלאות הדוח כמערכים – משמשות גם לתצוגה/הדפסה וגם לייצוא. */
function reportTables(c, d) {
  const T = {};
  T.students = {
    name: 'לפי תלמידה',
    head: ['תלמידה', 'כיתה', 'סל שבועי', 'תוכננו', 'התקיימו', 'נכחה', 'נעדרה', 'לא התקיימו', 'נדחו', 'סיבות ביטול / דחייה', 'לא דווחו', 'מורות שטרם דיווחו', 'מימוש'],
    rows: c.rows.slice().sort((a, b) => a.s.className.localeCompare(b.s.className, 'he') || a.s.name.localeCompare(b.s.name, 'he')).map(r => [
      r.s.name, r.s.className, r.s.approvedHours || 0, r.planned, r.held, r.present, r.absent, r.notHeld, r.postponed,
      reasonsText(r.reasons), r.missing, Object.keys(r.missingTeachers).join(', '), pctText(r.present, r.due)]),
  };
  T.teachers = {
    name: 'לפי מורה',
    head: ['מורה', 'שיעורים שתוכננו', 'דווחו', 'לא דווחו', 'התקיימו', 'לא התקיימו', 'נדחו', 'השלמת דיווח'],
    rows: c.teachers.slice().sort((a, b) => a.name.localeCompare(b.name, 'he')).map(t => [t.name, t.planned, t.reported, t.missing, t.held, t.notHeld, t.postponed, pctText(t.reported, t.due)]),
  };
  T.missing = {
    name: 'דיווחים חסרים',
    head: ['מורה', 'תאריך', 'יום', 'שעה', 'מקצוע', 'תלמידות'],
    rows: c.missing.slice().sort((a, b) => a.teacherName.localeCompare(b.teacherName, 'he') || (a.date < b.date ? -1 : 1))
      .map(l => [l.teacherName, fmtFull(l.date), DAY_LETTERS[weekday(l.date)], l.time, l.subject, studentsText(l.students)]),
  };
  T.lessons = {
    name: 'פירוט שיעורים',
    head: ['תאריך', 'יום', 'שעה', 'מורה', 'מקצוע', 'סוג', 'תלמידה', 'כיתה', 'מצב השיעור', 'נוכחות', 'סיבה', 'נושא השיעור', 'הערה'],
    rows: [],
  };
  c.lessons.forEach(l => l.students.filter(c.stuOk).forEach(s => {
    const st = !l.status ? (l.date < d.today ? 'טרם דווח' : 'מתוכנן') : l.status === POSTPONED && l.makeupDate ? 'נדחה ל' + fmtFull(l.makeupDate) : l.status;
    const att = l.status === HELD ? (s.present === false ? 'נעדרה' : 'נכחה') : '';
    const reason = l.status === HELD ? (s.present === false ? withText(s.reason, s.reasonText) : '') : withText(l.reason, l.reasonText);
    T.lessons.rows.push([fmtFull(l.date), DAY_LETTERS[weekday(l.date)], l.time, l.teacherName, l.subject, l.kind === 'השלמה' ? 'השלמה' : (l.students.length > 1 ? 'קבוצתי' : 'פרטני'),
      s.name, s.className, st, att, reason, l.topic, l.note]);
  }));
  return T;
}

function tableHtml(t, numCols) {
  if (!t.rows.length) return '<div class="card muted">אין נתונים</div>';
  const isNum = i => numCols && numCols.includes(i);
  return `<div class="tbl-wrap"><table><thead><tr>${t.head.map((x, i) => `<th${isNum(i) ? ' class="num"' : ''}>${h(x)}</th>`).join('')}</tr></thead><tbody>` +
    t.rows.map(r => `<tr>${r.map((v, i) => `<td${isNum(i) ? ' class="num"' : ''}${typeof v === 'string' && v.length > 25 ? ' style="white-space:normal;min-width:160px"' : ''}>${v === 0 && isNum(i) ? '<span class="muted">0</span>' : h(v)}</td>`).join('')}</tr>`).join('') +
    '</tbody></table></div>';
}

function reportModel() {
  const R = S.rep, d = R.data;
  const f = Object.assign({}, R.f, R.view === 'student' ? { student: R.student } : {});
  const c = computeStats(d, f);
  const T = reportTables(c, d);
  const period = `${fmtFull(d.from)} – ${fmtFull(d.to)}`;
  const filt = [R.f.className && 'כיתה ' + R.f.className, R.f.teacher && (d.teachers.find(t => t.email === R.f.teacher) || {}).name, R.f.subject].filter(Boolean).join(' · ');
  let title, sheets;
  if (R.view === 'students') { title = 'דוח מימוש שעות סל אישי – לפי תלמידה'; sheets = [T.students, T.teachers, T.missing, T.lessons]; }
  else if (R.view === 'teachers') { title = 'דוח דיווחי מורות'; sheets = [T.teachers, T.missing, T.students, T.lessons]; }
  else { const s = d.students.find(x => x.id === R.student); title = 'דוח שעות סל אישי – ' + (s ? s.name : ''); sheets = [T.students, T.lessons]; }
  return { c, T, title, period, filt, sheets };
}

function renderReports() {
  const R = S.rep, d = R.data;
  const views = [['students', 'סיכום לפי תלמידה'], ['teachers', 'דיווחי מורות'], ['student', 'דוח לתלמידה']];
  if (R.view === 'student' && !R.student) {
    const first = d.students.filter(s => s.active !== 'לא').sort((a, b) => a.name.localeCompare(b.name, 'he'))[0];
    R.student = first ? first.id : '';
  }
  const M = reportModel(), T = M.T;
  let html = `<div class="card no-print">
    <div class="chips" style="margin-bottom:10px">${views.map(([k, l]) => `<button class="chip${R.view === k ? ' on' : ''}" data-a="rep-view" data-v="${k}">${l}</button>`).join('')}</div>
    ${R.view === 'student' ? `<select data-a="rep-student" style="margin-bottom:10px">${d.students.slice().sort((a, b) => a.name.localeCompare(b.name, 'he')).map(s => opt(s.id, s.name + (s.className ? ' – ' + s.className : ''), R.student)).join('')}</select>` : ''}
    ${rangeHtml('rep')}${R.view === 'student' ? '' : filtersHtml('rep', false)}
    <div class="row" style="margin-top:12px">
      <button class="btn pri" data-a="rep-print">🖨️ הדפסה</button>
      <button class="btn" data-a="rep-xlsx">⬇️ ייצוא לאקסל</button>
      <button class="btn" data-a="rep-gsheet">פתיחה כגיליון Google</button>
    </div>
    <div class="muted small" style="margin-top:6px">קובץ האקסל כולל את כל הטבלאות של הדוח בלשוניות נפרדות. אם ההורדה לא מתחילה, אפשר לבחור "פתיחה כגיליון Google" ומשם להוריד כאקסל.</div>
  </div>`;

  html += `<div class="report"><div class="report-head"><h2>${h(M.title)}</h2>
    <div class="muted small">תקופה: ${M.period}${M.filt ? ' · ' + h(M.filt) : ''} · הופק ב־${fmtFull(S.today)}</div></div>`;

  const sum = M.c.tot;
  const sumLine = `<div class="kpis report-kpis">
      <div class="kpi"><div class="v">${sum.planned}</div><div class="l">שעות שתוכננו</div></div>
      <div class="kpi ok"><div class="v">${sum.held}</div><div class="l">התקיימו</div></div>
      <div class="kpi ok"><div class="v">${sum.present}</div><div class="l">נכחה</div></div>
      <div class="kpi warn"><div class="v">${sum.absent}</div><div class="l">נעדרה</div></div>
      <div class="kpi bad"><div class="v">${sum.notHeld}</div><div class="l">לא התקיימו</div></div>
      <div class="kpi info"><div class="v">${sum.postponed}</div><div class="l">נדחו</div></div>
      <div class="kpi bad"><div class="v">${sum.missingL}</div><div class="l">לא דווחו</div></div>
    </div>`;

  if (R.view === 'students') {
    html += sumLine + `<h3>סיכום לפי תלמידה</h3>` + tableHtml(T.students, [2, 3, 4, 5, 6, 7, 8, 10]);
    html += `<h3>מורות – השלמת דיווח</h3>` + tableHtml(T.teachers, [1, 2, 3, 4, 5, 6]);
  } else if (R.view === 'teachers') {
    html += `<h3>סיכום לפי מורה</h3>` + tableHtml(T.teachers, [1, 2, 3, 4, 5, 6]);
    html += `<h3>שיעורים שטרם דווחו (${T.missing.rows.length})</h3>` + (T.missing.rows.length ? tableHtml(T.missing) : '<div class="card muted">כל השיעורים המתוכננים דווחו 👍</div>');
  } else {
    const s = d.students.find(x => x.id === R.student);
    if (s) {
      const r = M.c.rows.find(x => x.s.id === s.id);
      html += `<div class="card"><b>${h(s.name)}</b> · כיתה ${h(s.className)} · סל שבועי: ${s.approvedHours} שעות · משובצות כרגע: ${s.scheduledWeekly}
        ${r ? `<div style="margin-top:6px">מימוש בתקופה: <b>${pctText(r.present, r.due)}</b> (נכחה ב־${r.present} מתוך ${r.due} שיעורים שהיו אמורים להתקיים)</div>` : ''}
        ${r && Object.keys(r.reasons).length ? `<div class="small" style="margin-top:4px">סיבות ביטול / דחייה: ${h(reasonsText(r.reasons))}</div>` : ''}
        ${r && r.missing ? `<div class="small" style="margin-top:4px;color:var(--bad)">לא דווחו ${r.missing} שיעורים (${h(Object.keys(r.missingTeachers).join(', '))})</div>` : ''}</div>`;
      html += sumLine;
      html += `<h3>פירוט השיעורים</h3>` + tableHtml({ head: T.lessons.head.filter((_, i) => i !== 6 && i !== 7), rows: T.lessons.rows.map(row => row.filter((_, i) => i !== 6 && i !== 7)) });
    }
  }
  html += '</div>';
  document.getElementById('app').innerHTML = html;
}

/* ---------- ייצוא ---------- */
function loadXlsxLib() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('טעינת רכיב האקסל נכשלה. אפשר להשתמש ב"פתיחה כגיליון Google".'));
    document.head.appendChild(s);
  });
}

function sheetName(n) { return n.replace(/[\\\/\?\*\[\]:]/g, ' ').slice(0, 31); }

async function exportXlsx() {
  const M = reportModel(), d = S.rep.data;
  try {
    setBusy(1);
    await loadXlsxLib();
    const wb = XLSX.utils.book_new();
    M.sheets.forEach(t => {
      const ws = XLSX.utils.aoa_to_sheet([t.head].concat(t.rows));
      ws['!cols'] = t.head.map((x, i) => ({ wch: Math.min(45, Math.max(String(x).length, ...t.rows.map(r => String(r[i] == null ? '' : r[i]).length)) + 2) }));
      XLSX.utils.book_append_sheet(wb, ws, sheetName(t.name));
    });
    wb.Workbook = { Views: [{ RTL: true }] };
    XLSX.writeFile(wb, `${M.title.replace(/[\\\/:*?"<>|]/g, '')} ${d.from} עד ${d.to}.xlsx`);
    toast('הקובץ ירד ✓');
  } catch (e) { fail(e); } finally { setBusy(-1); }
}

async function exportGSheet() {
  const M = reportModel(), d = S.rep.data;
  const win = window.open('', '_blank');
  try {
    const r = await call('exportSheet', { title: `${M.title} ${fmtFull(d.from)}–${fmtFull(d.to)}`, sheets: M.sheets.map(t => ({ name: sheetName(t.name), rows: [t.head].concat(t.rows) })) });
    if (win) win.location.href = r.url;
    else openModal(`<h3>הגיליון מוכן</h3><p><a href="${h(r.url)}" target="_blank">לחצי כאן לפתיחת הגיליון</a></p><div class="form-actions"><button class="btn" data-a="modal-close">סגירה</button></div>`);
  } catch (e) { if (win) win.close(); fail(e); }
}

/* ============================== מערכת שעות ============================== */
async function loadSched() {
  try { S.sched.data = await call('schedule', { date: S.sched.date || S.today }); renderSched(); } catch (e) { fail(e); }
}

function renderSched() {
  const d = S.sched.data, f = S.sched.f, B = S.boot;
  const stu = {}; d.students.forEach(s => { stu[s.id] = s; });
  const tName = {}; d.teachers.forEach(t => { tName[t.email] = t.name; });
  const classes = uniq(d.students.map(s => s.className));
  const slots = d.slots.filter(s => {
    const ids = s.studentIds.split(',');
    return (!f.teacher || s.teacherEmail === f.teacher) && (!f.day || s.day === f.day) &&
      (!f.student || ids.includes(f.student)) && (!f.className || ids.some(id => stu[id] && stu[id].className === f.className));
  });
  let html = '';
  if (canView()) {
    html += `<div class="card"><div class="filters" style="margin-top:0">
      <select data-a="sched-filter" data-k="student"><option value="">כל התלמידות</option>${d.students.filter(s => s.active !== 'לא').sort((a, b) => a.name.localeCompare(b.name, 'he')).map(s => opt(s.id, s.name, f.student)).join('')}</select>
      <select data-a="sched-filter" data-k="className"><option value="">כל הכיתות</option>${classes.map(x => opt(x, x, f.className)).join('')}</select>
      <select data-a="sched-filter" data-k="teacher"><option value="">כל המורות</option>${d.teachers.filter(t => t.role !== ROLE_MANAGER).map(t => opt(t.email, t.name, f.teacher)).join('')}</select>
      <select data-a="sched-filter" data-k="day"><option value="">כל הימים</option>${B.days.map(x => opt(x, 'יום ' + x, f.day)).join('')}</select>
    </div>${isCoord() ? '<div class="row" style="margin-top:10px"><button class="btn pri sm" data-a="slot-new">+ שיבוץ חדש</button></div>' : ''}</div>`;
  }
  if (f.student && stu[f.student]) {
    const s = stu[f.student], n = slots.filter(x => !x.validFrom || x.validFrom <= S.today).length;
    html += `<div class="alert ${s.approvedHours && n !== s.approvedHours ? 'warn' : ''}" style="background:${s.approvedHours && n !== s.approvedHours ? '' : 'var(--pri-weak)'}"><b>${h(s.name)}</b> · כיתה ${h(s.className)} · סל שבועי: ${s.approvedHours} שעות · משובצות כרגע: ${n}${s.approvedHours && n !== s.approvedHours ? ' ⚠ יש פער' : ''}</div>`;
  }
  const byDay = B.days.map(day => [day, slots.filter(s => s.day === day).sort((a, b) => a.time < b.time ? -1 : 1)]).filter(x => x[1].length);
  if (!byDay.length) html += '<div class="empty">אין שיבוצים להצגה</div>';
  html += byDay.map(([day, list]) => `<div class="daycol"><h4>יום ${h(day)}</h4>` + list.map(s => {
    const ids = s.studentIds.split(',');
    return `<div class="card slot"><div class="lesson-time">${h(s.time)}</div><div class="grow">
      <div class="lesson-subj">${h(s.subject)}${ids.length > 1 ? '<span class="tag">קבוצתי</span>' : ''}${s.validFrom > S.today ? `<span class="tag">החל מ${fmtFull(s.validFrom)}</span>` : ''}${s.validTo ? `<span class="tag">עד ${fmtFull(s.validTo)}</span>` : ''}</div>
      <div class="lesson-studs">${h(studentsText(ids.map(id => stu[id] || { name: '?' })))}</div>
      <div class="muted small">${h(tName[s.teacherEmail] || s.teacherEmail)}</div></div>
      ${isCoord() ? `<button class="btn sm" data-a="slot-edit" data-v="${h(s.id)}">עריכה</button>` : ''}</div>`;
  }).join('') + '</div>').join('');
  document.getElementById('app').innerHTML = html;
}

/* ============================== ניהול ============================== */
async function loadAdmin() {
  S.admin.history = null;
  try { S.admin.data = await call('adminData'); renderAdmin(); } catch (e) { fail(e); }
}
async function loadHistory() {
  try { S.admin.history = await call('history'); if (S.tab === 'admin' && S.admin.sub === 'history') renderAdmin(); } catch (e) { fail(e); }
}

function slotActiveToday(s) { return (!s.validFrom || s.validFrom <= S.today) && (!s.validTo || s.validTo >= S.today); }

function renderAdmin() {
  const A = S.admin, d = A.data;
  const subs = [['students', 'תלמידות'], ['slots', 'שיבוצים'], ['users', 'מורות ומשתמשים'], ['holidays', 'חופשות'], ['history', 'יומן שינויים'], ['settings', 'הגדרות']];
  let html = `<div class="subtabs">${subs.map(([k, l]) => `<button class="chip${A.sub === k ? ' on' : ''}" data-a="admin-sub" data-v="${k}">${l}</button>`).join('')}</div>`;
  const tName = {}; d.users.forEach(u => { tName[u.email.toLowerCase()] = u.name; });
  const stu = {}; d.students.forEach(s => { stu[s.id] = s; });

  if (A.sub === 'students') {
    const weekly = {};
    d.slots.filter(slotActiveToday).forEach(s => s.studentIds.split(',').forEach(id => { weekly[id] = (weekly[id] || 0) + 1; }));
    html += `<div class="row" style="margin-bottom:10px"><button class="btn pri" data-a="student-new">+ תלמידה חדשה</button></div>`;
    const list = d.students.slice().sort((a, b) => (a.active === 'לא') - (b.active === 'לא') || a.className.localeCompare(b.className, 'he') || a.name.localeCompare(b.name, 'he'));
    html += list.length ? list.map(s => {
      const n = weekly[s.id] || 0, mis = s.approvedHours && n !== s.approvedHours;
      const mySlots = d.slots.filter(x => slotActiveToday(x) && x.studentIds.split(',').includes(s.id));
      return `<div class="card${s.active === 'לא' ? ' dim' : ''}"><div class="list-item"><div class="grow">
        <b>${h(s.name)}</b> <span class="muted">· ${h(s.className)}</span>${s.active === 'לא' ? ' <span class="tag">לא פעילה</span>' : ''}
        <div class="small" style="margin-top:4px">סל שבועי: <b>${s.approvedHours}</b> · משובצות: <b>${n}</b> ${mis ? '<span class="badge b-warn">יש פער בין הסל לשיבוץ</span>' : ''}</div>
        ${mySlots.length ? `<div class="small muted" style="margin-top:4px">${mySlots.map(x => `${h(x.subject)} – ${h(tName[x.teacherEmail] || x.teacherEmail)} (יום ${h(x.day)} ${h(x.time)})`).join('<br>')}</div>` : ''}
        ${s.notes ? `<div class="small" style="margin-top:4px">📝 ${h(s.notes)}</div>` : ''}
      </div><button class="btn sm" data-a="student-edit" data-v="${h(s.id)}">עריכה</button></div></div>`;
    }).join('') : '<div class="empty">עדיין אין תלמידות. אפשר להתחיל בהוספת תלמידה.</div>';
  }

  if (A.sub === 'slots') {
    const list = d.slots.filter(s => A.showEnded || !s.validTo || s.validTo >= S.today)
      .sort((a, b) => (tName[a.teacherEmail] || '').localeCompare(tName[b.teacherEmail] || '', 'he') || S.boot.days.indexOf(a.day) - S.boot.days.indexOf(b.day) || (a.time < b.time ? -1 : 1));
    html += `<div class="row" style="margin-bottom:10px"><button class="btn pri" data-a="slot-new">+ שיבוץ חדש</button>
      <label class="small row" style="gap:4px"><input type="checkbox" data-a="admin-ended"${A.showEnded ? ' checked' : ''}> הצגת שיבוצים שהסתיימו</label></div>
      <div class="muted small" style="margin-bottom:8px">כל שיבוץ הוא מפגש שבועי קבוע. בשיעור קבוצתי בוחרים כמה תלמידות באותו שיבוץ.</div>`;
    html += list.length ? `<div class="tbl-wrap"><table><thead><tr><th>מורה</th><th>מקצוע</th><th>יום</th><th>שעה</th><th>תלמידות</th><th>תוקף</th><th></th></tr></thead><tbody>` +
      list.map(s => `<tr class="${s.validTo && s.validTo < S.today ? 'dim' : ''}"><td>${h(tName[s.teacherEmail] || s.teacherEmail)}</td><td>${h(s.subject)}</td><td>${h(s.day)}</td><td>${h(s.time)}</td>
        <td style="white-space:normal">${h(s.studentIds.split(',').map(id => stu[id] ? stu[id].name : '?').join(', '))}</td>
        <td class="small">${s.validFrom ? 'מ' + fmtFull(s.validFrom) : ''}${s.validTo ? ' עד ' + fmtFull(s.validTo) : ''}</td>
        <td><button class="btn sm" data-a="slot-edit" data-v="${h(s.id)}">עריכה</button></td></tr>`).join('') + '</tbody></table></div>'
      : '<div class="empty">אין שיבוצים</div>';
  }

  if (A.sub === 'users') {
    html += `<div class="row" style="margin-bottom:10px"><button class="btn pri" data-a="user-new">+ משתמשת חדשה</button></div>
      <div class="muted small" style="margin-bottom:8px">רק כתובות מייל שרשומות כאן יכולות להיכנס למערכת. <b>מורה</b> רואה ומדווחת רק על השיעורים שלה. <b>הנהלה</b> צופה בלוח הבקרה ובמערכת השעות. <b>רכזת</b> יכולה לנהל הכול.</div>`;
    html += d.users.slice().sort((a, b) => a.name.localeCompare(b.name, 'he')).map(u => `<div class="card${u.active === 'לא' ? ' dim' : ''}"><div class="list-item"><div class="grow">
        <b>${h(u.name)}</b> <span class="tag">${h(u.role)}</span>${u.active === 'לא' ? '<span class="tag">לא פעילה</span>' : ''}
        <div class="small muted" dir="ltr" style="text-align:right">${h(u.email)}</div></div>
        <button class="btn sm" data-a="user-edit" data-v="${h(u.email)}">עריכה</button></div></div>`).join('');
  }

  if (A.sub === 'holidays') {
    html += `<div class="card"><b>הוספת חופשה / יום ללא לימודים</b>
      <div class="row" style="margin-top:8px"><div class="grow"><label class="f">מתאריך</label><input type="date" id="hol-from"></div><div class="grow"><label class="f">עד תאריך (לא חובה)</label><input type="date" id="hol-to"></div></div>
      <label class="f">תיאור</label><input type="text" id="hol-desc" placeholder="לדוגמה: חופשת חנוכה">
      <div class="form-actions"><button class="btn pri" data-a="hol-add">הוספה</button></div>
      <div class="muted small" style="margin-top:6px">בימים האלה לא ייווצרו שיעורים, והם לא ייחשבו כשיעורים שלא התקיימו.</div></div>`;
    html += d.holidays.length ? d.holidays.map(x => `<div class="card list-item${(x.to || x.from) < S.today ? ' dim' : ''}"><div class="grow"><b>${h(x.description || 'חופשה')}</b>
        <div class="small muted">${fmtFull(x.from)}${x.to && x.to !== x.from ? ' – ' + fmtFull(x.to) : ''}</div></div>
        <button class="btn sm danger" data-a="hol-del" data-v="${h(x.id)}">מחיקה</button></div>`).join('') : '<div class="empty">לא הוגדרו חופשות</div>';
  }

  if (A.sub === 'settings') {
    const s = d.settings, hours = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
    html += `<div class="card"><b>תזכורות במייל למורות</b>
      <label class="row" style="margin-top:12px;gap:8px;font-size:16px"><input type="checkbox" id="set-on"${s.remindersOn ? ' checked' : ''} style="width:20px;height:20px"> לשלוח לכל מורה תזכורת יום לפני השיעורים שלה</label>
      <div class="row" style="margin-top:6px">
        <div class="grow"><label class="f">שעת שליחה בימים א׳–ה׳</label><select id="set-hour">${hours(8, 21).map(x => opt(x, String(x).padStart(2, '0') + ':00', s.reminderHour)).join('')}</select></div>
        <div class="grow"><label class="f">ביום שישי (לשיעורי יום ראשון)</label><select id="set-fri">${hours(7, 12).map(x => opt(x, String(x).padStart(2, '0') + ':00', s.fridayHour)).join('')}</select></div>
      </div>
      <div class="muted small" style="margin-top:8px">התזכורת כוללת את רשימת השיעורים של היום הבא, קישור לדיווח, וציון של שיעורים שעדיין לא דווחו. בשבת לא נשלחות תזכורות, והתזכורת לשיעורי יום ראשון נשלחת ביום שישי. בחופשות לא נשלח דבר.</div>
      <div class="form-actions"><button class="btn" data-a="set-test">שליחת תזכורת לדוגמה אליי</button></div>
    </div>
    <div class="card"><b>סיכום שבועי לרכזת</b>
      <label class="row" style="margin-top:12px;gap:8px;font-size:16px"><input type="checkbox" id="set-weekly"${s.weeklyOn ? ' checked' : ''} style="width:20px;height:20px"> לשלוח כל יום ראשון בבוקר סיכום של השבוע שעבר</label>
      <div class="row" style="margin-top:6px">
        <div class="grow"><label class="f">שעת שליחה ביום ראשון</label><select id="set-whour">${hours(7, 12).map(x => opt(x, String(x).padStart(2, '0') + ':00', s.weeklyHour)).join('')}</select></div>
        <label class="row grow" style="gap:8px;margin-top:22px"><input type="checkbox" id="set-wmgr"${s.weeklyToManagers ? ' checked' : ''} style="width:18px;height:18px"> לשלוח גם להנהלה</label>
      </div>
      <div class="muted small" style="margin-top:8px">הסיכום כולל את המימוש של כל תלמידה (עם סימון אדום לתלמידות מתחת לסף), דיווחים חסרים לפי מורה, והשלמות פתוחות.</div>
      <div class="form-actions"><button class="btn" data-a="set-test-weekly">שליחת סיכום לדוגמה אליי</button></div>
    </div>
    <div class="card"><b>סף התראה על מימוש נמוך</b>
      <div class="row" style="margin-top:8px"><input type="number" id="set-thr" min="10" max="100" step="5" value="${s.lowThreshold}" style="width:90px"> <span>%</span></div>
      <div class="muted small" style="margin-top:6px">תלמידה שאחוז המימוש שלה (נכחה מתוך השיעורים שתוכננו) נמוך מהסף תסומן באדום בלוח הבקרה ובסיכום השבועי. ההתראה מופיעה רק אחרי לפחות 3 שיעורים בתקופה, כדי שלא תהיה התראה מיותרת בתחילת שבוע.</div>
    </div>
    <div class="form-actions"><button class="btn pri" data-a="set-save">שמירת כל ההגדרות</button></div>`;
  }

  if (A.sub === 'history') {
    if (!A.history) { html += '<div class="empty">טוען…</div>'; loadHistory(); }
    else {
      const list = A.history.filter(x => !A.histTeacher || x.teacherEmail === A.histTeacher);
      html += `<div class="card"><div class="muted small" style="margin-bottom:8px">כל דיווח חדש וכל שינוי בדיווח קיים נרשמים כאן אוטומטית, כולל מה היה לפני השינוי. מוצגים 500 השינויים האחרונים, והיומן המלא נשמר בגיליון בלשונית "יומן שינויים".</div>
        <select data-a="hist-teacher"><option value="">כל המורות</option>${d.users.filter(u => u.role !== ROLE_MANAGER).map(u => opt(u.email.toLowerCase(), u.name, A.histTeacher)).join('')}</select></div>`;
      html += list.length ? list.map(x => `<div class="card hist${x.before ? ' changed' : ''}">
          <div class="row"><b class="grow">${fmtDate(x.date)} · ${h(x.subject)} · ${h(x.teacherName)}</b><span class="badge ${x.before ? 'b-warn' : 'b-pending'}">${h(x.action)}</span></div>
          <div class="muted small" style="margin-top:2px">${h(fmtStamp(x.at))} · ${h(x.byName)}</div>
          ${x.before ? `<div class="hist-line before"><span>לפני:</span> ${h(x.before)}</div>` : ''}
          <div class="hist-line"><span>${x.before ? 'אחרי:' : 'דיווח:'}</span> ${h(x.after)}</div>
        </div>`).join('') : '<div class="empty">אין עדיין שינויים</div>';
    }
  }
  document.getElementById('app').innerHTML = html;
}

/* ---------- חלונות עריכה ---------- */
function openModal(html) { document.getElementById('modal-box').innerHTML = html; document.getElementById('modal').classList.remove('hidden'); }
function closeModal() { document.getElementById('modal').classList.add('hidden'); }
function askConfirm(text, action, v) {
  openModal(`<h3>אישור</h3><p>${h(text)}</p><div class="form-actions"><button class="btn pri" data-a="${action}" data-v="${h(v)}">כן</button><button class="btn" data-a="modal-close">ביטול</button></div>`);
}
function val(id) { const el = document.getElementById(id); return el ? el.value : ''; }

function studentModal(s) {
  s = s || { id: '', name: '', className: '', approvedHours: '', active: 'כן', notes: '' };
  openModal(`<h3>${s.id ? 'עריכת תלמידה' : 'תלמידה חדשה'}</h3>
    <label class="f">שם מלא</label><input type="text" id="m-name" value="${h(s.name)}">
    <div class="row"><div class="grow"><label class="f">כיתה</label><input type="text" id="m-class" value="${h(s.className)}" placeholder="לדוגמה: ט2"></div>
    <div class="grow"><label class="f">שעות סל שבועיות</label><input type="number" min="0" step="1" id="m-hours" value="${h(s.approvedHours)}"></div></div>
    <label class="f">הערות</label><textarea id="m-notes">${h(s.notes)}</textarea>
    <label class="f">סטטוס</label><select id="m-active">${opt('כן', 'פעילה', s.active)}${opt('לא', 'לא פעילה (עזבה / סיימה)', s.active)}</select>
    <div class="form-actions"><button class="btn pri" data-a="student-save" data-v="${h(s.id)}">שמירה</button><button class="btn" data-a="modal-close">ביטול</button></div>`);
}

function userModal(u) {
  u = u || { email: '', name: '', role: ROLE_TEACHER, active: 'כן' };
  openModal(`<h3>${u.email ? 'עריכת משתמשת' : 'משתמשת חדשה'}</h3>
    <label class="f">שם</label><input type="text" id="m-name" value="${h(u.name)}">
    <label class="f">כתובת מייל (משמשת לכניסה)</label><input type="email" id="m-email" dir="ltr" value="${h(u.email)}">
    <label class="f">תפקיד</label><select id="m-role">${[ROLE_TEACHER, ROLE_COORD, ROLE_MANAGER].map(r => opt(r, r, u.role)).join('')}</select>
    <label class="f">סטטוס</label><select id="m-active">${opt('כן', 'פעילה', u.active)}${opt('לא', 'לא פעילה (אין כניסה)', u.active)}</select>
    <div class="form-actions"><button class="btn pri" data-a="user-save" data-v="${h(u.email)}">שמירה</button><button class="btn" data-a="modal-close">ביטול</button></div>`);
}

async function slotModal(slotId) {
  let d = S.admin.data;
  if (!d) { try { d = S.admin.data = await call('adminData'); } catch (e) { return fail(e); } }
  const s = slotId ? d.slots.find(x => x.id === slotId) : null;
  const v = s || { id: '', teacherEmail: '', subject: '', day: '', time: '', studentIds: '', validFrom: S.today, validTo: '' };
  const chosen = v.studentIds ? v.studentIds.split(',') : [];
  const subjects = uniq(d.slots.map(x => x.subject));
  const students = d.students.filter(x => x.active !== 'לא' || chosen.includes(x.id)).sort((a, b) => a.className.localeCompare(b.className, 'he') || a.name.localeCompare(b.name, 'he'));
  openModal(`<h3>${s ? 'עריכת שיבוץ' : 'שיבוץ חדש'}</h3>
    <label class="f">מורה</label><select id="m-teacher"><option value="">בחרי מורה…</option>${d.users.filter(u => u.active !== 'לא' && u.role !== ROLE_MANAGER).map(u => opt(u.email.toLowerCase(), u.name, v.teacherEmail)).join('')}</select>
    <label class="f">מקצוע</label><input type="text" id="m-subject" list="subj-list" value="${h(v.subject)}"><datalist id="subj-list">${subjects.map(x => `<option value="${h(x)}">`).join('')}</datalist>
    <div class="row"><div class="grow"><label class="f">יום</label><select id="m-day"><option value="">בחרי…</option>${S.boot.days.map(x => opt(x, x, v.day)).join('')}</select></div>
    <div class="grow"><label class="f">שעה</label><input type="time" id="m-time" value="${h(v.time)}"></div></div>
    <label class="f">תלמידות (אפשר לבחור כמה לשיעור קבוצתי)</label>
    <div class="checks">${students.map(x => `<label><input type="checkbox" class="m-stu" value="${h(x.id)}"${chosen.includes(x.id) ? ' checked' : ''}> ${h(x.name)} <span class="muted small">${h(x.className)}</span></label>`).join('') || '<div class="muted small">יש להוסיף תלמידות קודם</div>'}</div>
    ${s ? `<label class="f">השינוי בתוקף מתאריך</label><input type="date" id="m-eff" value="${S.today}">
           <div class="muted small">שיעורים שדווחו לפני התאריך הזה יישארו כפי שהם.</div>`
        : `<label class="f">בתוקף מתאריך</label><input type="date" id="m-from" value="${h(v.validFrom)}">`}
    <label class="f">בתוקף עד תאריך (לא חובה)</label><input type="date" id="m-to" value="${h(v.validTo)}">
    <div class="form-actions"><button class="btn pri" data-a="slot-save" data-v="${h(v.id)}">שמירה</button><button class="btn" data-a="modal-close">ביטול</button></div>
    ${s ? `<button class="btn ghost danger" style="margin-top:8px" data-a="slot-del" data-v="${h(v.id)}">הסרת השיבוץ</button>` : ''}`);
}

async function adminSave(action, payload, msg) {
  try {
    await call(action, payload);
    closeModal(); toast(msg || 'נשמר ✓');
    if (action === 'saveUser') S.boot = Object.assign(S.boot, await call('bootstrap'));
    if (S.tab === 'admin') loadAdmin(); else { S.admin.data = null; if (S.tab === 'sched') loadSched(); }
  } catch (e) { fail(e); }
}

/* ============================== אירועים ============================== */
document.addEventListener('click', e => {
  if (e.target.id === 'modal') return closeModal();
  const el = e.target.closest('[data-a]');
  if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  const a = el.dataset.a, v = el.dataset.v, id = el.dataset.id;
  const f = id ? S.forms[id] : null;
  switch (a) {
    case 'login-send': return loginSend();
    case 'login-verify': return loginVerify();
    case 'login-back': S.login.step = 'email'; return showLogin();
    case 'logout': return logout();
    case 'install-now': return installNow();
    case 'install-later': return installLater();
    case 'tab': return go(v);
    case 'modal-close': return closeModal();

    case 'day-move': S.day.date = addDays(S.day.date, Number(v)); return loadDay();
    case 'day-today': S.day.date = S.today; return loadDay();
    case 'open-form': formFor(findLesson(id)).open = true; return rerenderLesson(id);
    case 'close-form': delete S.forms[id]; return rerenderLesson(id);
    case 'choose': {
      const l = findLesson(id), sid = l.students[0].id;
      if (v === 'hp' || v === 'ha') { f.status = HELD; f.att[sid].present = v === 'hp'; }
      else f.status = { h: HELD, n: NOT_HELD, p: POSTPONED }[v];
      return rerenderLesson(id);
    }
    case 'att': f.att[el.dataset.sid].present = v === '1'; return rerenderLesson(id);
    case 'save-report': return saveReport(id);

    case 'range-preset': {
      const k = el.dataset.k, st = S[k];
      st.preset = v;
      if (v === 'custom') { const [a1, b1] = presetRange('month', st); st.from = st.from || a1; st.to = st.to || b1; return k === 'dash' ? renderDash() : renderReports(); }
      return loadRange(k);
    }
    case 'range-custom': {
      const k = el.dataset.k, st = S[k];
      st.from = val(k + '-from'); st.to = val(k + '-to');
      if (!st.from || !st.to || st.from > st.to) return toast('טווח תאריכים לא תקין', true);
      return loadRange(k);
    }
    case 'dash-student': S.dash.f.student = S.dash.f.student === v ? '' : v; return renderDash();
    case 'rep-view': S.rep.view = v; return renderReports();
    case 'rep-print': return window.print();
    case 'rep-xlsx': return exportXlsx();
    case 'rep-gsheet': return exportGSheet();
    case 'set-save': {
      const chk = id => document.getElementById(id).checked;
      return adminSave('saveSettings', {
        remindersOn: chk('set-on'), reminderHour: val('set-hour'), fridayHour: val('set-fri'),
        weeklyOn: chk('set-weekly'), weeklyHour: val('set-whour'), weeklyToManagers: chk('set-wmgr'), lowThreshold: val('set-thr'),
      }, 'ההגדרות נשמרו').then(() => call('bootstrap')).then(b => { if (b) S.boot.threshold = b.threshold; });
    }
    case 'set-test': return call('testReminder').then(r => toast(`נשלח מייל בדיקה אל ${r.sentTo} (דוגמה של ${r.sample})`)).catch(fail);
    case 'set-test-weekly': return call('testWeekly').then(r => toast(`נשלח סיכום לדוגמה (${fmtDate(r.from, false)}–${fmtDate(r.to, false)}) אל ${r.sentTo.join(', ')}`)).catch(fail);

    case 'admin-sub': S.admin.sub = v; return renderAdmin();
    case 'student-new': return studentModal();
    case 'student-edit': return studentModal(S.admin.data.students.find(s => s.id === v));
    case 'student-save': return adminSave('saveStudent', { id: v, name: val('m-name'), className: val('m-class'), approvedHours: val('m-hours'), notes: val('m-notes'), active: val('m-active') });
    case 'user-new': return userModal();
    case 'user-edit': return userModal(S.admin.data.users.find(u => u.email === v));
    case 'user-save': return adminSave('saveUser', { originalEmail: v, email: val('m-email'), name: val('m-name'), role: val('m-role'), active: val('m-active') });
    case 'slot-new': return slotModal('');
    case 'slot-edit': return slotModal(v);
    case 'slot-save': return adminSave('saveSlot', {
      id: v, teacherEmail: val('m-teacher'), subject: val('m-subject'), day: val('m-day'), time: val('m-time'),
      studentIds: [...document.querySelectorAll('.m-stu:checked')].map(x => x.value),
      validFrom: val('m-from'), validTo: val('m-to'), effectiveFrom: val('m-eff'),
    });
    case 'slot-del': return askConfirm('להסיר את השיבוץ? אם כבר דווחו עליו שיעורים, הוא רק יסתיים והדיווחים יישמרו.', 'slot-del-yes', v);
    case 'slot-del-yes': return adminSave('deleteSlot', { id: v }, 'השיבוץ הוסר');
    case 'hol-add': return adminSave('saveHoliday', { from: val('hol-from'), to: val('hol-to'), description: val('hol-desc') }, 'החופשה נוספה');
    case 'hol-del': return askConfirm('למחוק את החופשה?', 'hol-del-yes', v);
    case 'hol-del-yes': return adminSave('deleteHoliday', { id: v }, 'נמחק');
  }
});

document.addEventListener('change', e => {
  const el = e.target, a = el.dataset.a;
  if (a === 'day-teacher') { S.day.teacher = el.value; return loadDay(); }
  if (a === 'day-pick') { if (el.value) { S.day.date = el.value; loadDay(); } return; }
  if (a === 'filter') { const k = el.dataset.s; S[k].f[el.dataset.k] = el.value; return k === 'dash' ? renderDash() : renderReports(); }
  if (a === 'rep-student') { S.rep.student = el.value; return renderReports(); }
  if (a === 'sched-filter') { S.sched.f[el.dataset.k] = el.value; return renderSched(); }
  if (a === 'admin-ended') { S.admin.showEnded = el.checked; return renderAdmin(); }
  if (a === 'hist-teacher') { S.admin.histTeacher = el.value; return renderAdmin(); }
  const fld = el.dataset.f, id = el.dataset.id;
  if (!fld || !S.forms[id]) return;
  const f = S.forms[id];
  if (fld === 'reason') { f.reason = el.value; return rerenderLesson(id); }
  if (fld === 'attReason') { f.att[el.dataset.sid].reason = el.value; return rerenderLesson(id); }
});

document.addEventListener('input', e => {
  const el = e.target, fld = el.dataset.f, id = el.dataset.id;
  if (!fld || !S.forms[id]) return;
  const f = S.forms[id];
  if (fld === 'attReasonText') f.att[el.dataset.sid].reasonText = el.value;
  else if (fld !== 'reason' && fld !== 'attReason') f[fld] = el.value;
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'lg-email') loginSend();
  if (e.target.id === 'lg-code') loginVerify();
});

init();
showInstall();
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
